'fd.gps':['Shown in Geolocation and correlated with other files. Coordinates can be edited by anyone, so check them against other evidence.','Exibida em Geolocalização e correlacionada com outros arquivos. Coordenadas podem ser editadas; confronte com outras evidências.','Affichée dans Géolocalisation et corrélée aux autres fichiers. Les coordonnées sont modifiables : à recouper.','Mostrata in Geolocalizzazione e correlata. Le coordinate sono modificabili: verificale con altri elementi.','Widoczna w Geolokalizacji i skorelowana z innymi plikami. Współrzędne można edytować — porównaj z innymi dowodami.','In der Geolokalisierung angezeigt und korreliert. Koordinaten sind änderbar — mit anderen Beweisen abgleichen.','Se muestra en Geolocalización y se correlaciona. Las coordenadas son editables: contrástelas con otras pruebas.'],

'fd.jpeg_q':['Cameras usually use their own (custom) tables; IJG/libjpeg standard tables point to software re-encoding (apps, websites, editors).','Câmeras costumam usar tabelas próprias (custom); tabelas padrão IJG/libjpeg indicam recodificação por software (apps, sites, editores).','Les appareils utilisent des tables propres ; des tables standard IJG indiquent un réencodage logiciel.','Le fotocamere usano tabelle proprie; le tabelle standard IJG indicano una ricodifica software.','Aparaty używają własnych tablic; standardowe tablice IJG wskazują ponowne kodowanie programowe.','Kameras nutzen eigene Tabellen; IJG-Standardtabellen deuten auf Neukodierung durch Software.','Las cámaras usan tablas propias; las tablas estándar IJG indican recodificación por software.'],

'fd.pdf_sig':['Signer names, signing times and certificate names are listed in Identities and the Timeline. Validity of the certificate must be checked with an official validator.','Nomes dos signatários, horários e nomes do certificado aparecem em Identidades e Linha do tempo. A validade do certificado deve ser verificada em validador oficial.','Signataires, heures et certificats figurent dans Identités et Chronologie. La validité doit être vérifiée par un validateur officiel.','Firmatari, orari e certificati sono in Identità e Cronologia. La validità va verificata con un validatore ufficiale.','Podpisujący, czasy i nazwy certyfikatów są w Tożsamościach i na Osi czasu. Ważność sprawdź oficjalnym walidatorem.','Unterzeichner, Zeiten und Zertifikatsnamen stehen unter Identitäten und Zeitachse. Gültigkeit mit offiziellem Validator prüfen.','Firmantes, horas y certificados figuran en Identidades y Línea de tiempo. La validez debe comprobarse con un validador oficial.'],

'rp.methodtxt':['Each item was read without modification. MD5, SHA-1, SHA-256 and CRC-32 were computed at intake and every action was recorded in a hash-chained custody log.\nThe true format was identified from the internal signature, independently of the extension. The internal structure was parsed (EXIF, XMP, IPTC, ICC, JPEG segments and quantisation, PNG chunks, PDF objects, revisions and signatures, ISO-BMFF/QuickTime, Matroska and RIFF containers, ID3/Vorbis tags, OOXML/ODF/OLE2 properties, tracked changes and comments, e-mail headers and relay path, chat exports and text indicators).\nRule-based checks compared dates, software, dimensions, thumbnails, structure and authentication. All dates were placed on one timeline and correlated across items (shared identities, near-simultaneous events, nearby positions, duplicates and attachments). Visual laboratory analyses (ELA, noise, edges, histogram, clone detection, waveform, spectrogram, frame analysis) were performed when recorded as observations.','Cada item foi lido sem modificação. MD5, SHA-1, SHA-256 e CRC-32 foram calculados na entrada e toda ação foi registrada numa cadeia de custódia encadeada por hash.\nO formato verdadeiro foi identificado pela assinatura interna, independentemente da extensão. A estrutura interna foi analisada (EXIF, XMP, IPTC, ICC, segmentos e quantização JPEG, blocos PNG, objetos, revisões e assinaturas PDF, contêineres ISO-BMFF/QuickTime, Matroska e RIFF, etiquetas ID3/Vorbis, propriedades OOXML/ODF/OLE2, alterações controladas e comentários, cabeçalhos e rota de e-mail, exportações de conversas e indicadores em texto).\nVerificações baseadas em regras compararam datas, software, dimensões, miniaturas, estrutura e autenticação. Todas as datas foram reunidas numa linha do tempo e correlacionadas entre os itens (identidades compartilhadas, eventos quase simultâneos, posições próximas, duplicatas e anexos). Análises visuais de laboratório (ELA, ruído, bordas, histograma, clones, forma de onda, espectrograma, quadros) foram realizadas quando registradas como observações.','Chaque élément a été lu sans modification. MD5, SHA-1, SHA-256 et CRC-32 ont été calculés à l’entrée et chaque action consignée dans un journal chaîné par empreintes.\nLe vrai format a été identifié par la signature interne. La structure a été analysée (EXIF, XMP, IPTC, ICC, segments JPEG, blocs PNG, objets, révisions et signatures PDF, conteneurs ISO-BMFF, Matroska et RIFF, étiquettes ID3/Vorbis, propriétés OOXML/ODF/OLE2, suivi des modifications, en-têtes d’e-mail, discussions et indicateurs textuels).\nDes contrôles par règles ont comparé dates, logiciels, dimensions, miniatures, structure et authentification. Toutes les dates ont été réunies sur une chronologie et corrélées entre éléments. Les analyses visuelles de laboratoire ont été réalisées lorsqu’elles figurent comme observations.','Ogni elemento è stato letto senza modifiche. MD5, SHA-1, SHA-256 e CRC-32 sono stati calcolati all’acquisizione e ogni azione registrata in un registro concatenato via hash.\nIl formato reale è stato identificato dalla firma interna. La struttura è stata analizzata (EXIF, XMP, IPTC, ICC, segmenti JPEG, blocchi PNG, oggetti, revisioni e firme PDF, contenitori ISO-BMFF, Matroska e RIFF, tag ID3/Vorbis, proprietà OOXML/ODF/OLE2, revisioni e commenti, intestazioni e-mail, chat e indicatori testuali).\nControlli basati su regole hanno confrontato date, software, dimensioni, miniature, struttura e autenticazione. Tutte le date sono state riunite in una cronologia e correlate tra gli elementi. Le analisi visive di laboratorio sono state svolte quando registrate come osservazioni.','Każdy element odczytano bez modyfikacji. Przy przyjęciu obliczono MD5, SHA-1, SHA-256 i CRC-32, a każdą czynność zapisano w łańcuchowym dzienniku.\nPrawdziwy format ustalono po sygnaturze wewnętrznej. Przeanalizowano strukturę (EXIF, XMP, IPTC, ICC, segmenty JPEG, bloki PNG, obiekty, wersje i podpisy PDF, kontenery ISO-BMFF, Matroska i RIFF, tagi ID3/Vorbis, właściwości OOXML/ODF/OLE2, śledzone zmiany, nagłówki e-mail, czaty i wskaźniki w tekście).\nKontrole regułowe porównały daty, oprogramowanie, wymiary, miniatury, strukturę i uwierzytelnienie. Wszystkie daty umieszczono na wspólnej osi czasu i skorelowano. Analizy wizualne wykonano, gdy zapisano je jako obserwacje.','Jedes Element wurde unverändert gelesen. MD5, SHA-1, SHA-256 und CRC-32 wurden bei Eingang berechnet und jede Aktion in einem hashverketteten Protokoll erfasst.\nDas wahre Format wurde anhand der internen Signatur bestimmt. Die Struktur wurde ausgewertet (EXIF, XMP, IPTC, ICC, JPEG-Segmente, PNG-Chunks, PDF-Objekte, Revisionen und Signaturen, ISO-BMFF-, Matroska- und RIFF-Container, ID3/Vorbis, OOXML/ODF/OLE2-Eigenschaften, Änderungsverfolgung, E-Mail-Header, Chats und Textindikatoren).\nRegelbasierte Prüfungen verglichen Daten, Software, Abmessungen, Vorschaubilder, Struktur und Authentifizierung. Alle Daten wurden auf einer Zeitachse vereint und korreliert. Visuelle Laboranalysen wurden durchgeführt, soweit als Beobachtungen erfasst.','Cada elemento se leyó sin modificarlo. Se calcularon MD5, SHA-1, SHA-256 y CRC-32 al ingreso y cada acción quedó en un registro encadenado por hash.\nEl formato real se identificó por la firma interna. Se analizó la estructura (EXIF, XMP, IPTC, ICC, segmentos JPEG, bloques PNG, objetos, revisiones y firmas PDF, contenedores ISO-BMFF, Matroska y RIFF, etiquetas ID3/Vorbis, propiedades OOXML/ODF/OLE2, cambios controlados, cabeceras de correo, chats e indicadores en texto).\nControles basados en reglas compararon fechas, software, dimensiones, miniaturas, estructura y autenticación. Todas las fechas se reunieron en una línea de tiempo y se correlacionaron. Los análisis visuales se realizaron cuando constan como observaciones.'],

'rp.limitstxt':['The findings are technical indicators derived from the files’ structure and metadata. Metadata can be removed or forged by anyone with suitable tools; the absence of indicators does not prove authenticity, and their presence does not by itself prove manipulation.\nIdentities are those recorded in the files and do not establish who physically created or used them. File-system dates reflect the copy examined and may change on copying or download. Times without a time zone are shown in the local time of the examining device.\nCertificate validity, content-level authenticity of audio/video and attribution to a specific device require complementary examination with reference material.','Os achados são indicadores técnicos derivados da estrutura e dos metadados dos arquivos. Metadados podem ser removidos ou forjados por quem tenha ferramentas adequadas; a ausência de indicadores não prova autenticidade, e sua presença não prova, por si só, manipulação.\nAs identidades são as registradas nos arquivos e não estabelecem quem fisicamente os criou ou usou. Datas do sistema de arquivos refletem a cópia examinada e podem mudar em cópias ou downloads. Horários sem fuso aparecem na hora local do dispositivo de exame.\nA validade de certificados, a autenticidade de conteúdo de áudio/vídeo e a atribuição a um dispositivo específico exigem exame complementar com material de referência.','Les constats sont des indicateurs techniques issus de la structure et des métadonnées. Les métadonnées peuvent être supprimées ou falsifiées ; l’absence d’indicateurs ne prouve pas l’authenticité, et leur présence ne prouve pas à elle seule une manipulation.\nLes identités sont celles enregistrées et n’établissent pas qui a physiquement créé ou utilisé les fichiers. Les dates système reflètent la copie examinée. Les heures sans fuseau sont affichées en heure locale.\nLa validité des certificats, l’authenticité du contenu audio/vidéo et l’attribution à un appareil exigent un examen complémentaire avec du matériel de référence.','I rilievi sono indicatori tecnici derivati da struttura e metadati. I metadati possono essere rimossi o falsificati; l’assenza di indicatori non prova l’autenticità e la loro presenza non prova di per sé una manipolazione.\nLe identità sono quelle registrate e non stabiliscono chi abbia materialmente creato o usato i file. Le date del file system riflettono la copia esaminata. Gli orari senza fuso sono mostrati in ora locale.\nValidità dei certificati, autenticità del contenuto audio/video e attribuzione a un dispositivo richiedono un esame complementare con materiale di riferimento.','Ustalenia są wskaźnikami technicznymi wynikającymi ze struktury i metadanych. Metadane można usunąć lub sfałszować; brak wskaźników nie dowodzi autentyczności, a ich obecność sama w sobie nie dowodzi manipulacji.\nTożsamości to dane zapisane w plikach i nie przesądzają, kto fizycznie je utworzył lub używał. Daty systemu plików dotyczą badanej kopii. Czasy bez strefy pokazano w czasie lokalnym.\nWażność certyfikatów, autentyczność treści audio/wideo i przypisanie do urządzenia wymagają badań uzupełniających z materiałem porównawczym.','Die Befunde sind technische Hinweise aus Struktur und Metadaten. Metadaten lassen sich entfernen oder fälschen; fehlende Hinweise beweisen keine Echtheit, vorhandene allein keine Manipulation.\nIdentitäten sind die in den Dateien gespeicherten Angaben und belegen nicht, wer sie tatsächlich erstellt oder genutzt hat. Dateisystemdaten betreffen die untersuchte Kopie. Zeiten ohne Zeitzone erscheinen in Ortszeit.\nZertifikatsgültigkeit, inhaltliche Echtheit von Audio/Video und Gerätezuordnung erfordern ergänzende Untersuchungen mit Vergleichsmaterial.','Los hallazgos son indicadores técnicos derivados de la estructura y los metadatos. Los metadatos pueden eliminarse o falsificarse; la ausencia de indicadores no prueba autenticidad y su presencia no prueba por sí sola manipulación.\nLas identidades son las registradas en los archivos y no establecen quién los creó o usó físicamente. Las fechas del sistema reflejan la copia examinada. Las horas sin zona horaria se muestran en hora local.\nLa validez de certificados, la autenticidad del contenido de audio/vídeo y la atribución a un dispositivo requieren examen complementario con material de referencia.'],

const MANUAL={
en:[
['intro','Introduction',['Omega is a forensic workstation that runs entirely in your browser. It examines text, e-mail, chats, audio, video, images, photographs, PDF and office documents, and turns what it finds into findings, conclusions, a common timeline and complete reports.','It is organised like an operating system: each tool is an application that opens in its own window, and all tools share the same case. Nothing is uploaded — the files never leave your device.']],
['start','Getting started',['- Open Settings and fill in the case title, case number, examiner and organisation. They appear in every report and in the custody log.\n- Add evidence: drag files anywhere on the screen, or use “Add evidence” in the Start menu, the Dashboard or the Evidence window.\n- Each file is hashed (MD5, SHA-1, SHA-256, CRC-32), identified by its signature and analysed automatically.\n- Open the Inspector to read findings and conclusions, the Timeline to see everything in order, and Reports to issue the report.']],
['desktop','Desktop, windows and taskbar',['Double-click an icon to open a tool (one tap on touch screens). Windows can be moved by their title bar, resized from the lower-right corner, maximised with a double-click on the title, minimised or closed with the buttons on the right.','The taskbar shows open windows; click one to bring it forward or minimise it. The Start button lists every tool with a search box, the language selector and the theme switch. On phones every window opens full-screen.']],
['evidence','Evidence and Inspector',['The Evidence window lists all items with type, size, integrity verdict and SHA-256. Click a row to open it in the Inspector. Removing an item asks for confirmation and is recorded in the custody log.','The Inspector has eight tabs: Summary (conclusions, preview and quick links), Findings (each indicator with its explanation), Metadata (every field read, grouped by source, searchable), Events (all dated events), Identities (authors, accounts, devices, senders, signers…), Locations, Hashes (with a verification box) and Notes.']],
['timeline','Timeline',['The Timeline gathers every dated event from every file in one chronological view, one lane per file. Colours show the kind of event (creation, modification, capture, signature, communication…). Hollow points are times recorded without a time zone.','Zoom with the mouse wheel, a pinch or the buttons; drag to move in time; tap a point to see its details and the events of other files within the correlation window. Below the chart you find chronological anomalies, groups of near-simultaneous events and the full list, which can be copied or downloaded as CSV.']],
['map','Geolocation',['All GPS positions found in photos, videos, documents, embedded images and texts are drawn on a local map grid with a scale bar, numbered in chronological order and linked by the route. The table gives coordinates, time, distance from the previous point and a link to OpenStreetMap. No external map is loaded inside the application.']],
['labs','Image, audio and video labs',['Image lab: Original, Error Level Analysis (ELA), Noise, Edges, Histogram, Clone detection and EXIF thumbnail comparison. Adjust quality and amplification, then read the statistics under the image.','Audio lab: decodes the audio (also from video files) and shows peak, RMS, clipping, waveform and spectrogram, marking abrupt discontinuities, runs of digital silence and long silences. Tap anywhere to listen from that point.','Video lab: frame-by-frame stepping, frame capture and automatic frame analysis that detects abrupt cuts and frozen segments.','In every lab you can save an observation with severity and the current image; it becomes a finding of the item and appears in the report.']],
['hex','Hex & strings',['Shows the raw bytes with offset, hexadecimal and text columns, with search (text or hex) and go-to-offset. Other tabs list readable strings (ASCII and UTF-16), plot the entropy of each block to reveal compressed, encrypted or hidden regions, and list file signatures embedded after the start of the file.']],
['compare','Comparator',['Choose two items to compare their hashes, sizes and every metadata field side by side (only differences, if you wish). Two images get a visual difference map; two texts get a line-by-line difference.']],
['report','Reports and export',['Choose the report language (any of the seven, independently of the interface), the sections and the items. Preview opens the report; Download saves a self-contained HTML file that prints cleanly to PDF; Copy places the HTML on the clipboard. Each issued report is recorded in the custody log with its SHA-256.','Export case (JSON) saves all findings, events, identities, metadata, notes and observations. Importing that JSON restores notes and observations for files with the same SHA-256.']],
['custody','Chain of custody',['Every action — adding, removing, re-analysing, notes, lab observations, reports, exports and settings — is recorded with time, examiner and a SHA-256 hash linked to the previous entry. “Verify integrity” recomputes the whole chain; if any entry was altered, the chain breaks at that point.']],
['interpret','Interpreting findings',['Findings are technical indicators with a severity. High: strong sign of alteration, inconsistency or risk. Medium: processing or editing that deserves review. Low: weak indicator. Info: context that helps the investigation without lowering the score.','The integrity score starts at 100 and loses 30 per high, 12 per medium and 4 per low finding. Always read findings together: for example, “edited with Photoshop” plus “thumbnail differs” plus “modification after capture” is much stronger than any one of them alone.']],
['formats','Supported formats',['The engines read the following formats directly from their bytes, without any external library:']],
['limits','Limitations',['Metadata can be removed or forged. Absence of indicators does not prove authenticity, and one indicator alone does not prove manipulation. Identities are what the file records, not who physically used it. File-system dates belong to the copy you have. Times without a time zone are displayed in this device’s local time.','Very large files (several GB) may exceed the browser’s memory. Some formats (for example HEIC) can be analysed but not displayed by every browser. Certificate validation and voice or device attribution need specialised examinations.']],
['faq','FAQ and support',['- Are my files sent anywhere? No. Everything runs locally; there are no network requests.\n- Will the case remain after closing? Yes, in this browser (IndexedDB), until you use “Clear case” in Settings.\n- Why does a WhatsApp photo have no metadata? Messaging apps strip metadata and recompress images; the finding “No internal metadata” and the file-name pattern explain this.\n- Why do two times differ by some hours? One is recorded in UTC and the other without a time zone; check the ⧗ mark.\n- How do I get a PDF? Download the HTML report and print it with “Save as PDF”.\n- Support: copy the diagnostic information in “About & versions” (it contains no file content) and attach it to your request.']],
['trouble','Troubleshooting',['- Download or print does nothing: some embedded viewers block them. Use Copy, or open the standalone Omega file directly in the browser.\n- Audio or video does not decode: the browser lacks that codec; the structural analysis is still complete.\n- The page is slow: very large files take longer to hash; analyse fewer at a time.\n- Wrong language in old findings: changing the language re-analyses all items automatically.']],
['versions','Versions',['Omega 1.0.0 (2026-11-24), stable channel — first complete release: operating-system shell, 15 tools, engines for images, audio, video, PDF, office documents, e-mail, chats and text, rule-based interpretation, cross-file correlation, timeline, geolocation, labs, hash-chained custody log and reports in English, Portuguese, French, Italian, Polish, German and Spanish.','Component versions are listed in “About & versions”. The report format carries its own version number so that reports remain comparable across releases.']],
['shortcuts','Keyboard shortcuts',['- Ctrl/⌘ + Shift + O: add evidence\n- Ctrl/⌘ + Shift + D: dashboard · E: evidence · I: inspector · T: timeline · M: map · R: reports · H: manual\n- Esc: close the Start menu or a preview\n- In the hex view: Enter searches the next occurrence or jumps to the offset typed']]

pt:[
['intro','Introdução',['O Omega é uma estação de perícia forense que funciona inteiramente no navegador. Examina textos, e-mails, conversas, áudios, vídeos, imagens, fotografias, PDFs e documentos de escritório e transforma o que encontra em achados, conclusões, uma linha do tempo comum e relatórios completos.','É organizado como um sistema operacional: cada ferramenta é um aplicativo que abre em sua própria janela, e todas compartilham o mesmo caso. Nada é enviado — os arquivos nunca saem do seu dispositivo.']],
['start','Primeiros passos',['- Abra Configurações e preencha título do caso, número, perito e instituição. Esses dados aparecem em todos os relatórios e na cadeia de custódia.\n- Adicione evidências: arraste arquivos para qualquer lugar da tela ou use “Adicionar evidências” no menu Iniciar, no Painel ou na janela Evidências.\n- Cada arquivo recebe hashes (MD5, SHA-1, SHA-256, CRC-32), é identificado pela assinatura e analisado automaticamente.\n- Abra o Inspetor para ler achados e conclusões, a Linha do tempo para ver tudo em ordem e Relatórios para emitir o laudo.']],
['desktop','Área de trabalho, janelas e barra de tarefas',['Dê dois cliques num ícone para abrir uma ferramenta (um toque em telas sensíveis). As janelas se movem pela barra de título, mudam de tamanho pelo canto inferior direito, maximizam com dois cliques no título e minimizam ou fecham pelos botões à direita.','A barra de tarefas mostra as janelas abertas; clique para trazer à frente ou minimizar. O botão Iniciar lista todas as ferramentas com busca, seletor de idioma e troca de tema. No celular, toda janela abre em tela cheia.']],
['evidence','Evidências e Inspetor',['A janela Evidências lista todos os itens com tipo, tamanho, veredito de integridade e SHA-256. Clique numa linha para abri-la no Inspetor. Remover um item pede confirmação e é registrado na cadeia de custódia.','O Inspetor tem oito abas: Resumo (conclusões, prévia e atalhos), Achados (cada indicador com explicação), Metadados (todos os campos lidos, agrupados por fonte, com busca), Eventos (todos os eventos datados), Identidades (autores, contas, dispositivos, remetentes, signatários…), Localizações, Hashes (com caixa de verificação) e Notas.']],
['timeline','Linha do tempo',['A Linha do tempo reúne todos os eventos datados de todos os arquivos numa só visão cronológica, uma faixa por arquivo. As cores indicam o tipo (criação, modificação, captura, assinatura, comunicação…). Pontos vazados são horários sem fuso horário.','Dê zoom com a roda do mouse, pinça ou botões; arraste para mover no tempo; toque num ponto para ver detalhes e os eventos de outros arquivos dentro da janela de correlação. Abaixo ficam as anomalias cronológicas, os grupos de eventos quase simultâneos e a lista completa, que pode ser copiada ou baixada em CSV.']],
['map','Geolocalização',['Todas as posições GPS encontradas em fotos, vídeos, documentos, imagens embutidas e textos são desenhadas numa grade local com escala, numeradas em ordem cronológica e ligadas pelo trajeto. A tabela traz coordenadas, horário, distância do ponto anterior e link para o OpenStreetMap. Nenhum mapa externo é carregado dentro do aplicativo.']],
['labs','Laboratórios de imagem, áudio e vídeo',['Laboratório de imagem: Original, Análise de Nível de Erro (ELA), Ruído, Bordas, Histograma, Detecção de clones e comparação com a miniatura EXIF. Ajuste qualidade e amplificação e leia as estatísticas abaixo da imagem.','Laboratório de áudio: decodifica o áudio (também de vídeos) e mostra pico, RMS, saturação, forma de onda e espectrograma, marcando descontinuidades abruptas, silêncios digitais e silêncios longos. Toque em qualquer ponto para ouvir dali.','Laboratório de vídeo: avanço quadro a quadro, captura de quadro e análise automática que detecta cortes bruscos e trechos congelados.','Em todo laboratório é possível salvar uma observação com gravidade e a imagem atual; ela vira achado do item e entra no relatório.']],
['hex','Hex e strings',['Mostra os bytes brutos com colunas de offset, hexadecimal e texto, com busca (texto ou hex) e ir para offset. As outras abas listam textos legíveis (ASCII e UTF-16), desenham a entropia por bloco para revelar regiões comprimidas, criptografadas ou ocultas e listam assinaturas de arquivos embutidas após o início.']],
['compare','Comparador',['Escolha dois itens para comparar hashes, tamanhos e todos os campos de metadados lado a lado (só as diferenças, se quiser). Duas imagens geram um mapa de diferença visual; dois textos, uma comparação linha a linha.']],
['report','Relatórios e exportação',['Escolha o idioma do relatório (qualquer um dos sete, independentemente da interface), as seções e os itens. Visualizar abre o relatório; Baixar salva um HTML autossuficiente que imprime bem em PDF; Copiar coloca o HTML na área de transferência. Cada relatório emitido é registrado na cadeia de custódia com seu SHA-256.','Exportar caso (JSON) salva todos os achados, eventos, identidades, metadados, notas e observações. Importar esse JSON restaura notas e observações dos arquivos com o mesmo SHA-256.']],
['custody','Cadeia de custódia',['Toda ação — adicionar, remover, reanalisar, notas, observações de laboratório, relatórios, exportações e configurações — é registrada com hora, perito e um hash SHA-256 ligado ao registro anterior. “Verificar integridade” recalcula toda a cadeia; se algum registro foi alterado, a cadeia se quebra naquele ponto.']],
['interpret','Interpretação dos achados',['Achados são indicadores técnicos com gravidade. Alto: forte sinal de alteração, inconsistência ou risco. Médio: processamento ou edição que merece revisão. Baixo: indicador fraco. Informativo: contexto útil à investigação, sem reduzir a pontuação.','A pontuação de integridade começa em 100 e perde 30 por achado alto, 12 por médio e 4 por baixo. Leia sempre os achados em conjunto: “editado no Photoshop” + “miniatura diferente” + “modificação após a captura” é muito mais forte do que qualquer um isolado.']],
['formats','Formatos suportados',['Os motores leem os formatos abaixo diretamente dos bytes, sem nenhuma biblioteca externa:']],
['limits','Limitações',['Metadados podem ser removidos ou forjados. A ausência de indicadores não prova autenticidade, e um indicador isolado não prova manipulação. Identidades são o que o arquivo registra, não quem fisicamente o usou. Datas do sistema de arquivos pertencem à cópia que você tem. Horários sem fuso aparecem na hora local deste dispositivo.','Arquivos muito grandes (vários GB) podem exceder a memória do navegador. Alguns formatos (por exemplo HEIC) são analisados, mas nem todo navegador os exibe. Validação de certificados e atribuição de voz ou dispositivo exigem exames especializados.']],
['faq','Perguntas frequentes e suporte',['- Meus arquivos são enviados para algum lugar? Não. Tudo roda localmente; não há requisições de rede.\n- O caso continua depois de fechar? Sim, neste navegador (IndexedDB), até usar “Apagar caso” em Configurações.\n- Por que uma foto do WhatsApp não tem metadados? Aplicativos de mensagens removem metadados e recomprimem imagens; o achado “Sem metadados internos” e o padrão do nome explicam isso.\n- Por que dois horários diferem em algumas horas? Um está em UTC e o outro sem fuso; observe a marca ⧗.\n- Como obter um PDF? Baixe o relatório HTML e imprima com “Salvar como PDF”.\n- Suporte: copie as informações de diagnóstico em “Sobre e versões” (sem conteúdo de arquivos) e anexe ao seu pedido.']],
['trouble','Solução de problemas',['- Baixar ou imprimir não funciona: alguns visualizadores embutidos bloqueiam. Use Copiar ou abra o arquivo independente do Omega direto no navegador.\n- Áudio ou vídeo não decodifica: falta o codec no navegador; a análise estrutural continua completa.\n- A página está lenta: arquivos muito grandes demoram para gerar hash; analise menos de cada vez.\n- Idioma antigo nos achados: trocar o idioma reanalisa todos os itens automaticamente.']],
['versions','Versões',['Omega 1.0.0 (24/11/2026), canal estável — primeira versão completa: shell de sistema operacional, 15 ferramentas, motores para imagens, áudio, vídeo, PDF, documentos de escritório, e-mail, conversas e texto, interpretação por regras, correlação entre arquivos, linha do tempo, geolocalização, laboratórios, cadeia de custódia encadeada por hash e relatórios em inglês, português, francês, italiano, polonês, alemão e espanhol.','As versões dos componentes estão em “Sobre e versões”. O formato do relatório tem número de versão próprio para que relatórios continuem comparáveis entre versões.']],
['shortcuts','Atalhos de teclado',['- Ctrl/⌘ + Shift + O: adicionar evidências\n- Ctrl/⌘ + Shift + D: painel · E: evidências · I: inspetor · T: linha do tempo · M: mapa · R: relatórios · H: manual\n- Esc: fecha o menu Iniciar ou uma visualização\n- Na visualização hex: Enter busca a próxima ocorrência ou vai ao offset digitado']]
],
fr:[
['intro','Introduction',['Omega est une station d’expertise forensique qui fonctionne entièrement dans le navigateur. Il examine textes, e-mails, discussions, audio, vidéo, images, photos, PDF et documents bureautiques, et transforme ses observations en constats, conclusions, chronologie commune et rapports complets.','Il est organisé comme un système d’exploitation : chaque outil est une application dans sa propre fenêtre, et tous partagent le même dossier. Rien n’est envoyé — les fichiers ne quittent jamais votre appareil.']],
['start','Prise en main',['- Ouvrez Paramètres et renseignez intitulé, numéro de dossier, expert et organisme. Ils figurent dans chaque rapport et dans le journal.\n- Ajoutez des preuves : glissez des fichiers n’importe où, ou utilisez « Ajouter des preuves » (menu Démarrer, tableau de bord, fenêtre Preuves).\n- Chaque fichier est haché (MD5, SHA-1, SHA-256, CRC-32), identifié par sa signature et analysé automatiquement.\n- Ouvrez l’Inspecteur pour les constats, la Chronologie pour l’ordre des événements et Rapports pour émettre le rapport.']],
['desktop','Bureau, fenêtres et barre des tâches',['Double-cliquez sur une icône pour ouvrir un outil (un toucher sur écran tactile). Déplacez les fenêtres par la barre de titre, redimensionnez-les par le coin inférieur droit, agrandissez-les par double-clic sur le titre, réduisez-les ou fermez-les avec les boutons de droite.','La barre des tâches montre les fenêtres ouvertes. Le bouton Démarrer liste tous les outils avec recherche, choix de langue et de thème. Sur téléphone, chaque fenêtre s’ouvre en plein écran.']],
['evidence','Preuves et Inspecteur',['La fenêtre Preuves liste les éléments avec type, taille, verdict d’intégrité et SHA-256. Cliquez sur une ligne pour l’ouvrir dans l’Inspecteur. La suppression demande confirmation et est consignée.','L’Inspecteur comporte huit onglets : Synthèse, Constats (avec explications), Métadonnées (tous les champs, par source, avec recherche), Événements, Identités (auteurs, comptes, appareils, expéditeurs, signataires…), Positions, Empreintes (avec vérification) et Notes.']],
['timeline','Chronologie',['La Chronologie réunit tous les événements datés de tous les fichiers, une ligne par fichier. Les couleurs indiquent le type d’événement. Les points creux sont des heures sans fuseau.','Zoomez à la molette, au pincement ou avec les boutons ; glissez pour vous déplacer ; touchez un point pour le détail et les événements d’autres fichiers dans la fenêtre de corrélation. Dessous : anomalies chronologiques, groupes d’événements quasi simultanés et liste complète, exportable en CSV.']],
['map','Géolocalisation',['Toutes les positions GPS trouvées dans photos, vidéos, documents, images incorporées et textes sont tracées sur une grille locale avec échelle, numérotées chronologiquement et reliées par le trajet. Le tableau donne coordonnées, heure, distance au point précédent et lien OpenStreetMap. Aucune carte externe n’est chargée dans l’application.']],
['labs','Labos image, audio et vidéo',['Labo image : Original, analyse du niveau d’erreur (ELA), Bruit, Contours, Histogramme, Détection de clones et comparaison avec la miniature EXIF.','Labo audio : décode l’audio (aussi des vidéos) et affiche crête, RMS, écrêtage, forme d’onde et spectrogramme, en marquant discontinuités, silences numériques et silences longs.','Labo vidéo : avance image par image, capture et analyse automatique des coupes brusques et segments figés.','Dans chaque labo, vous pouvez enregistrer une observation avec sa gravité et l’image courante ; elle devient un constat et figure dans le rapport.']],
['hex','Hex et chaînes',['Affiche les octets bruts (offset, hexadécimal, texte) avec recherche et accès direct à un offset. Les autres onglets listent les chaînes lisibles, tracent l’entropie par bloc pour révéler des zones compressées, chiffrées ou cachées et listent les signatures incorporées.']],
['compare','Comparateur',['Choisissez deux éléments pour comparer empreintes, tailles et métadonnées côte à côte. Deux images donnent une carte de différence ; deux textes, une comparaison ligne à ligne.']],
['report','Rapports et export',['Choisissez la langue du rapport (une des sept, indépendamment de l’interface), les sections et les éléments. Aperçu l’affiche ; Télécharger enregistre un HTML autonome imprimable en PDF ; Copier le met dans le presse-papiers. Chaque rapport est consigné avec son SHA-256.','L’export JSON contient constats, événements, identités, métadonnées, notes et observations ; son import restaure notes et observations des fichiers de même SHA-256.']],
['custody','Chaîne de traçabilité',['Chaque action est consignée avec l’heure, l’expert et une empreinte SHA-256 liée à l’entrée précédente. « Vérifier l’intégrité » recalcule toute la chaîne ; toute modification la rompt à cet endroit.']],
['interpret','Interpréter les constats',['Élevé : fort signe d’altération, d’incohérence ou de risque. Moyen : traitement ou édition à examiner. Faible : indicateur ténu. Info : contexte utile, sans effet sur le score.','Le score d’intégrité part de 100 et perd 30 par constat élevé, 12 par moyen et 4 par faible. Lisez les constats ensemble : plusieurs indices concordants pèsent bien plus qu’un seul.']],
['formats','Formats pris en charge',['Les moteurs lisent directement les formats suivants, sans bibliothèque externe :']],
['limits','Limites',['Les métadonnées peuvent être supprimées ou falsifiées. L’absence d’indicateurs ne prouve pas l’authenticité et un indicateur isolé ne prouve pas une manipulation. Les identités sont celles déclarées par le fichier. Les dates système concernent votre copie. Les heures sans fuseau sont affichées en heure locale.','Les très gros fichiers peuvent dépasser la mémoire du navigateur. Certains formats (HEIC) sont analysés mais pas toujours affichés. La validation de certificats et l’attribution de voix ou d’appareil exigent des examens spécialisés.']],
['faq','FAQ et assistance',['- Mes fichiers sont-ils envoyés ? Non, tout est local.\n- Le dossier reste-t-il après fermeture ? Oui, dans ce navigateur, jusqu’à « Effacer le dossier ».\n- Pourquoi une photo WhatsApp n’a pas de métadonnées ? Les messageries les suppriment et recompressent.\n- Pourquoi deux heures diffèrent de quelques heures ? L’une est en UTC, l’autre sans fuseau (marque ⧗).\n- Comment obtenir un PDF ? Téléchargez le rapport HTML et imprimez-le en PDF.\n- Assistance : copiez le diagnostic dans « À propos et versions » (sans contenu de fichier) et joignez-le à votre demande.']],
['trouble','Dépannage',['- Téléchargement ou impression sans effet : certains visualiseurs les bloquent ; utilisez Copier ou ouvrez le fichier autonome dans le navigateur.\n- Audio ou vidéo non décodé : codec absent ; l’analyse structurelle reste complète.\n- Lenteur : les très gros fichiers prennent du temps ; analysez-en moins à la fois.\n- Changer de langue réanalyse automatiquement tous les éléments.']],
['versions','Versions',['Omega 1.0.0 (24/11/2026), canal stable — première version complète : interface de système d’exploitation, 15 outils, moteurs images, audio, vidéo, PDF, bureautique, e-mail, discussions et texte, interprétation par règles, corrélation, chronologie, géolocalisation, labos, journal chaîné et rapports en sept langues.','Les versions des composants figurent dans « À propos et versions ».']],
['shortcuts','Raccourcis clavier',['- Ctrl/⌘ + Maj + O : ajouter des preuves\n- Ctrl/⌘ + Maj + D : tableau de bord · E : preuves · I : inspecteur · T : chronologie · M : carte · R : rapports · H : manuel\n- Échap : ferme le menu Démarrer ou un aperçu']]
],
it:[
['intro','Introduzione',['Omega è una postazione di perizia forense che funziona interamente nel browser. Esamina testi, e-mail, chat, audio, video, immagini, foto, PDF e documenti d’ufficio e trasforma quanto trova in rilievi, conclusioni, una cronologia comune e rapporti completi.','È organizzato come un sistema operativo: ogni strumento è un’applicazione in una propria finestra e tutti condividono lo stesso caso. Nulla viene caricato: i file non lasciano mai il dispositivo.']],
['start','Primi passi',['- Apri Impostazioni e compila titolo, numero del caso, perito ed ente.\n- Aggiungi i reperti trascinando i file ovunque o con «Aggiungi reperti».\n- Ogni file riceve hash (MD5, SHA-1, SHA-256, CRC-32), viene identificato dalla firma e analizzato automaticamente.\n- Usa l’Ispettore per rilievi e conclusioni, la Cronologia per l’ordine degli eventi e Rapporti per emettere la relazione.']],
['desktop','Desktop, finestre e barra',['Doppio clic su un’icona per aprire uno strumento (un tocco su schermi touch). Le finestre si spostano dalla barra del titolo, si ridimensionano dall’angolo in basso a destra, si ingrandiscono con doppio clic sul titolo.','La barra mostra le finestre aperte. Il pulsante Start elenca tutti gli strumenti con ricerca, lingua e tema. Sul telefono ogni finestra si apre a schermo intero.']],
['evidence','Reperti e Ispettore',['La finestra Reperti elenca gli elementi con tipo, dimensione, verdetto e SHA-256. Fai clic su una riga per aprirla nell’Ispettore. La rimozione richiede conferma ed è registrata.','L’Ispettore ha otto schede: Sintesi, Rilievi (con spiegazioni), Metadati (tutti i campi, per fonte, con ricerca), Eventi, Identità, Posizioni, Hash (con verifica) e Note.']],
['timeline','Cronologia',['La Cronologia riunisce tutti gli eventi datati di tutti i file, una corsia per file. I colori indicano il tipo di evento; i punti vuoti sono orari senza fuso.','Zoom con rotellina, pizzico o pulsanti; trascina per spostarti; tocca un punto per i dettagli e gli eventi di altri file nella finestra di correlazione. Sotto: anomalie, gruppi di eventi quasi simultanei ed elenco completo esportabile in CSV.']],
['map','Geolocalizzazione',['Tutte le posizioni GPS trovate vengono disegnate su una griglia locale con scala, numerate in ordine cronologico e collegate dal percorso. La tabella riporta coordinate, ora, distanza e link a OpenStreetMap. Nessuna mappa esterna viene caricata nell’applicazione.']],
['labs','Laboratori immagini, audio e video',['Immagini: Originale, ELA, Rumore, Bordi, Istogramma, Rilevamento cloni e confronto con la miniatura EXIF.','Audio: decodifica l’audio (anche dai video) e mostra picco, RMS, saturazione, forma d’onda e spettrogramma, segnalando discontinuità, silenzi digitali e silenzi lunghi.','Video: avanzamento per fotogramma, cattura e analisi automatica di tagli bruschi e segmenti fermi.','In ogni laboratorio puoi salvare un’osservazione con gravità e immagine; diventa un rilievo e compare nel rapporto.']],
['hex','Hex e stringhe',['Mostra i byte grezzi con offset, esadecimale e testo, con ricerca e salto a offset. Le altre schede elencano stringhe leggibili, l’entropia per blocco e le firme incorporate.']],
['compare','Comparatore',['Scegli due elementi per confrontare hash, dimensioni e metadati affiancati. Due immagini producono una mappa di differenze; due testi un confronto riga per riga.']],
['report','Rapporti ed esportazione',['Scegli la lingua del rapporto (una delle sette), le sezioni e gli elementi. Anteprima lo mostra; Scarica salva un HTML autonomo stampabile in PDF; Copia lo mette negli appunti. Ogni rapporto è registrato con il suo SHA-256.','L’esportazione JSON contiene tutto il caso; importarla ripristina note e osservazioni dei file con lo stesso SHA-256.']],
['custody','Catena di custodia',['Ogni azione è registrata con ora, perito e un hash SHA-256 collegato alla voce precedente. «Verifica integrità» ricalcola la catena; qualsiasi modifica la interrompe in quel punto.']],
['interpret','Interpretare i rilievi',['Alto: forte segno di alterazione, incoerenza o rischio. Medio: elaborazione da verificare. Basso: indicatore debole. Info: contesto utile, senza effetto sul punteggio.','Il punteggio parte da 100 e perde 30 per rilievo alto, 12 per medio e 4 per basso. Leggi i rilievi insieme: più indizi concordanti valgono molto più di uno solo.']],
['formats','Formati supportati',['I motori leggono direttamente i seguenti formati, senza librerie esterne:']],
['limits','Limiti',['I metadati possono essere rimossi o falsificati. L’assenza di indicatori non prova l’autenticità e un solo indicatore non prova una manipolazione. Le identità sono quelle dichiarate dal file. Le date del file system riguardano la tua copia.','File molto grandi possono superare la memoria del browser. Alcuni formati (HEIC) sono analizzati ma non sempre visualizzati. Validazione dei certificati e attribuzione richiedono esami specialistici.']],
['faq','FAQ e supporto',['- I file vengono inviati? No, tutto è locale.\n- Il caso resta dopo la chiusura? Sì, in questo browser, fino a «Cancella caso».\n- Perché una foto WhatsApp non ha metadati? Le app di messaggistica li rimuovono.\n- Perché due orari differiscono di alcune ore? Uno è in UTC, l’altro senza fuso (segno ⧗).\n- Come ottengo un PDF? Scarica il rapporto HTML e stampalo come PDF.\n- Supporto: copia la diagnostica in «Info e versioni» (senza contenuto dei file) e allegala.']],
['trouble','Risoluzione problemi',['- Download o stampa non funzionano: alcuni visualizzatori li bloccano; usa Copia o apri il file autonomo nel browser.\n- Audio o video non decodificati: manca il codec; l’analisi strutturale resta completa.\n- Lentezza: i file molto grandi richiedono tempo.\n- Cambiare lingua rianalizza automaticamente tutti gli elementi.']],
['versions','Versioni',['Omega 1.0.0 (24/11/2026), canale stabile — prima versione completa: interfaccia da sistema operativo, 15 strumenti, motori per immagini, audio, video, PDF, documenti, e-mail, chat e testo, interpretazione a regole, correlazione, cronologia, geolocalizzazione, laboratori, catena di custodia e rapporti in sette lingue.','Le versioni dei componenti sono in «Info e versioni».']],
['shortcuts','Scorciatoie',['- Ctrl/⌘ + Maiusc + O: aggiungi reperti\n- Ctrl/⌘ + Maiusc + D: pannello · E: reperti · I: ispettore · T: cronologia · M: mappa · R: rapporti · H: manuale\n- Esc: chiude il menu Start o un’anteprima']]
],
pl:[
['intro','Wprowadzenie',['Omega to stanowisko ekspertyzy kryminalistycznej działające w całości w przeglądarce. Bada teksty, e-maile, czaty, audio, wideo, obrazy, zdjęcia, PDF i dokumenty biurowe, a wyniki przedstawia jako ustalenia, wnioski, wspólną oś czasu i pełne raporty.','Jest zorganizowany jak system operacyjny: każde narzędzie to aplikacja we własnym oknie, a wszystkie korzystają z tej samej sprawy. Nic nie jest wysyłane — pliki nie opuszczają urządzenia.']],
['start','Pierwsze kroki',['- Otwórz Ustawienia i uzupełnij tytuł i numer sprawy, biegłego oraz instytucję.\n- Dodaj dowody: przeciągnij pliki w dowolne miejsce lub użyj „Dodaj dowody”.\n- Każdy plik otrzymuje skróty (MD5, SHA-1, SHA-256, CRC-32), jest rozpoznawany po sygnaturze i analizowany automatycznie.\n- Inspektor pokazuje ustalenia i wnioski, Oś czasu — kolejność zdarzeń, a Raporty służą do wydania raportu.']],
['desktop','Pulpit, okna i pasek zadań',['Kliknij dwukrotnie ikonę, aby otworzyć narzędzie (jedno dotknięcie na ekranie dotykowym). Okna przesuwa się za pasek tytułu, zmienia rozmiar za prawy dolny róg, maksymalizuje dwuklikiem na tytule.','Pasek zadań pokazuje otwarte okna. Przycisk Start zawiera wszystkie narzędzia, wyszukiwarkę, wybór języka i motywu. Na telefonie każde okno otwiera się na pełnym ekranie.']],
['evidence','Dowody i Inspektor',['Okno Dowody pokazuje elementy z typem, rozmiarem, oceną integralności i SHA-256. Kliknij wiersz, aby otworzyć go w Inspektorze. Usunięcie wymaga potwierdzenia i jest rejestrowane.','Inspektor ma osiem kart: Podsumowanie, Ustalenia (z objaśnieniami), Metadane (wszystkie pola wg źródła, z wyszukiwaniem), Zdarzenia, Tożsamości, Lokalizacje, Skróty (z weryfikacją) i Notatki.']],
['timeline','Oś czasu',['Oś czasu zbiera wszystkie datowane zdarzenia ze wszystkich plików, po jednym pasie na plik. Kolory oznaczają rodzaj zdarzenia; puste punkty to czasy bez strefy czasowej.','Powiększaj kółkiem myszy, gestem lub przyciskami; przeciągaj, aby przesuwać; dotknij punktu, aby zobaczyć szczegóły i zdarzenia innych plików w oknie korelacji. Poniżej są anomalie, grupy niemal równoczesnych zdarzeń i pełna lista z eksportem CSV.']],
['map','Geolokalizacja',['Wszystkie znalezione pozycje GPS są rysowane na lokalnej siatce ze skalą, numerowane chronologicznie i łączone trasą. Tabela zawiera współrzędne, czas, odległość i link do OpenStreetMap. Aplikacja nie wczytuje żadnych zewnętrznych map.']],
['labs','Laboratoria obrazu, audio i wideo',['Obraz: Oryginał, ELA, Szum, Krawędzie, Histogram, Wykrywanie klonów i porównanie z miniaturą EXIF.','Audio: dekoduje dźwięk (także z wideo) i pokazuje szczyt, RMS, przesterowanie, przebieg i spektrogram, zaznaczając nieciągłości, cyfrowe cisze i długie cisze.','Wideo: przechodzenie klatka po klatce, przechwytywanie i automatyczna analiza cięć oraz zamrożeń.','W każdym laboratorium można zapisać obserwację z wagą i bieżącym obrazem; staje się ustaleniem i trafia do raportu.']],
['hex','Hex i ciągi',['Pokazuje surowe bajty (offset, hex, tekst) z wyszukiwaniem i skokiem do offsetu. Pozostałe karty pokazują czytelne ciągi, entropię bloków i osadzone sygnatury plików.']],
['compare','Porównywarka',['Wybierz dwa elementy, aby porównać skróty, rozmiary i metadane obok siebie. Dwa obrazy dają mapę różnic, dwa teksty — porównanie wiersz po wierszu.']],
['report','Raporty i eksport',['Wybierz język raportu (jeden z siedmiu), sekcje i elementy. Podgląd wyświetla raport; Pobierz zapisuje samodzielny HTML do wydruku jako PDF; Kopiuj umieszcza go w schowku. Każdy raport jest rejestrowany z jego SHA-256.','Eksport JSON zawiera całą sprawę; import przywraca notatki i obserwacje plików o tym samym SHA-256.']],
['custody','Łańcuch dowodowy',['Każda czynność jest zapisywana z czasem, biegłym i skrótem SHA-256 powiązanym z poprzednim wpisem. „Sprawdź integralność” przelicza cały łańcuch; każda zmiana przerywa go w tym miejscu.']],
['interpret','Interpretacja ustaleń',['Wysoki: silna oznaka zmiany, niespójności lub ryzyka. Średni: przetwarzanie lub edycja do weryfikacji. Niski: słaby wskaźnik. Informacja: kontekst bez wpływu na wynik.','Wynik zaczyna się od 100 i traci 30 za ustalenie wysokie, 12 za średnie i 4 za niskie. Czytaj ustalenia łącznie: kilka zgodnych wskazówek waży znacznie więcej niż jedna.']],
['formats','Obsługiwane formaty',['Silniki odczytują bezpośrednio następujące formaty, bez zewnętrznych bibliotek:']],
['limits','Ograniczenia',['Metadane można usunąć lub sfałszować. Brak wskaźników nie dowodzi autentyczności, a pojedynczy wskaźnik nie dowodzi manipulacji. Tożsamości to dane deklarowane przez plik. Daty systemu plików dotyczą Twojej kopii.','Bardzo duże pliki mogą przekroczyć pamięć przeglądarki. Niektóre formaty (HEIC) są analizowane, ale nie zawsze wyświetlane. Walidacja certyfikatów i przypisanie wymagają badań specjalistycznych.']],
['faq','FAQ i pomoc',['- Czy pliki są gdzieś wysyłane? Nie, wszystko działa lokalnie.\n- Czy sprawa pozostaje po zamknięciu? Tak, w tej przeglądarce, do „Wyczyść sprawę”.\n- Dlaczego zdjęcie z WhatsApp nie ma metadanych? Komunikatory je usuwają.\n- Dlaczego dwa czasy różnią się o kilka godzin? Jeden jest w UTC, drugi bez strefy (znak ⧗).\n- Jak uzyskać PDF? Pobierz raport HTML i wydrukuj jako PDF.\n- Pomoc: skopiuj diagnostykę w „O programie i wersje” (bez treści plików) i dołącz do zgłoszenia.']],
['trouble','Rozwiązywanie problemów',['- Pobieranie lub drukowanie nie działa: niektóre przeglądarki osadzone je blokują; użyj Kopiuj lub otwórz plik samodzielny.\n- Audio lub wideo się nie dekoduje: brak kodeka; analiza struktury pozostaje pełna.\n- Spowolnienie: bardzo duże pliki wymagają czasu.\n- Zmiana języka automatycznie ponownie analizuje wszystkie elementy.']],
['versions','Wersje',['Omega 1.0.0 (24.11.2026), kanał stabilny — pierwsza pełna wersja: interfejs systemu operacyjnego, 15 narzędzi, silniki dla obrazów, audio, wideo, PDF, dokumentów, e-maili, czatów i tekstu, interpretacja regułowa, korelacja, oś czasu, geolokalizacja, laboratoria, łańcuch dowodowy i raporty w siedmiu językach.','Wersje komponentów są w „O programie i wersje”.']],
['shortcuts','Skróty klawiszowe',['- Ctrl/⌘ + Shift + O: dodaj dowody\n- Ctrl/⌘ + Shift + D: pulpit · E: dowody · I: inspektor · T: oś czasu · M: mapa · R: raporty · H: podręcznik\n- Esc: zamyka menu Start lub podgląd']]
],
de:[
['intro','Einführung',['Omega ist ein forensischer Arbeitsplatz, der vollständig im Browser läuft. Er untersucht Texte, E-Mails, Chats, Audio, Video, Bilder, Fotos, PDF und Office-Dokumente und macht daraus Befunde, Schlussfolgerungen, eine gemeinsame Zeitachse und vollständige Berichte.','Er ist wie ein Betriebssystem aufgebaut: Jedes Werkzeug ist eine Anwendung in einem eigenen Fenster, alle teilen denselben Fall. Nichts wird hochgeladen — die Dateien verlassen nie Ihr Gerät.']],
['start','Erste Schritte',['- Öffnen Sie die Einstellungen und tragen Sie Falltitel, Aktenzeichen, Sachverständigen und Organisation ein.\n- Fügen Sie Beweismittel hinzu: Dateien irgendwohin ziehen oder „Beweismittel hinzufügen“ nutzen.\n- Jede Datei wird gehasht (MD5, SHA-1, SHA-256, CRC-32), per Signatur erkannt und automatisch analysiert.\n- Der Inspektor zeigt Befunde und Schlussfolgerungen, die Zeitachse die Reihenfolge, unter Berichte erstellen Sie das Gutachten.']],
['desktop','Desktop, Fenster und Taskleiste',['Doppelklick auf ein Symbol öffnet ein Werkzeug (Antippen auf Touchscreens). Fenster werden an der Titelleiste verschoben, an der unteren rechten Ecke skaliert und per Doppelklick maximiert.','Die Taskleiste zeigt offene Fenster. Der Start-Knopf listet alle Werkzeuge mit Suche, Sprache und Design. Auf dem Telefon öffnet jedes Fenster im Vollbild.']],
['evidence','Beweismittel und Inspektor',['Das Fenster Beweismittel listet alle Elemente mit Typ, Größe, Integritätsbewertung und SHA-256. Ein Klick öffnet das Element im Inspektor. Entfernen erfordert Bestätigung und wird protokolliert.','Der Inspektor hat acht Reiter: Übersicht, Befunde (mit Erläuterung), Metadaten (alle Felder nach Quelle, durchsuchbar), Ereignisse, Identitäten, Orte, Hashwerte (mit Prüfung) und Notizen.']],
['timeline','Zeitachse',['Die Zeitachse vereint alle datierten Ereignisse aller Dateien, eine Spur je Datei. Farben zeigen die Ereignisart; hohle Punkte sind Zeiten ohne Zeitzone.','Zoomen mit Mausrad, Geste oder Knöpfen; ziehen zum Verschieben; Punkt antippen für Details und Ereignisse anderer Dateien im Korrelationsfenster. Darunter: Auffälligkeiten, Gruppen nahezu gleichzeitiger Ereignisse und die vollständige Liste mit CSV-Export.']],
['map','Geolokalisierung',['Alle gefundenen GPS-Positionen werden auf einem lokalen Raster mit Maßstab gezeichnet, chronologisch nummeriert und durch die Route verbunden. Die Tabelle zeigt Koordinaten, Zeit, Abstand und einen OpenStreetMap-Link. Es werden keine externen Karten geladen.']],
['labs','Bild-, Audio- und Videolabor',['Bild: Original, ELA, Rauschen, Kanten, Histogramm, Klonerkennung und Vergleich mit der EXIF-Vorschau.','Audio: dekodiert den Ton (auch aus Videos) und zeigt Spitze, RMS, Übersteuerung, Wellenform und Spektrogramm mit Markierung von Sprüngen, digitaler Stille und langen Pausen.','Video: Einzelbildschritt, Frame-Erfassung und automatische Analyse von Schnitten und Standbildern.','In jedem Labor kann eine Beobachtung mit Schweregrad und aktuellem Bild gespeichert werden; sie wird zum Befund und erscheint im Bericht.']],
['hex','Hex & Strings',['Zeigt die Rohbytes (Offset, Hex, Text) mit Suche und Sprung zu einem Offset. Weitere Reiter zeigen lesbare Strings, die Blockentropie und eingebettete Dateisignaturen.']],
['compare','Vergleich',['Wählen Sie zwei Elemente, um Hashwerte, Größen und Metadaten nebeneinander zu vergleichen. Zwei Bilder ergeben eine Differenzkarte, zwei Texte einen zeilenweisen Vergleich.']],
['report','Berichte und Export',['Wählen Sie die Berichtssprache (eine der sieben), Abschnitte und Elemente. Vorschau zeigt den Bericht; Herunterladen speichert ein eigenständiges HTML, das sich als PDF drucken lässt; Kopieren legt es in die Zwischenablage. Jeder Bericht wird mit seinem SHA-256 protokolliert.','Der JSON-Export enthält den ganzen Fall; der Import stellt Notizen und Beobachtungen für Dateien mit gleichem SHA-256 wieder her.']],
['custody','Beweismittelkette',['Jede Aktion wird mit Zeit, Sachverständigem und einem an den vorigen Eintrag gekoppelten SHA-256-Hash erfasst. „Integrität prüfen“ berechnet die Kette neu; jede Änderung bricht sie an dieser Stelle.']],
['interpret','Befunde interpretieren',['Hoch: starkes Zeichen für Veränderung, Widerspruch oder Risiko. Mittel: Bearbeitung, die geprüft werden sollte. Niedrig: schwacher Hinweis. Info: hilfreicher Kontext ohne Einfluss auf die Punktzahl.','Die Punktzahl beginnt bei 100 und verliert 30 je hohem, 12 je mittlerem und 4 je niedrigem Befund. Befunde stets gemeinsam lesen: mehrere übereinstimmende Hinweise wiegen viel mehr als einer.']],
['formats','Unterstützte Formate',['Die Engines lesen folgende Formate direkt aus den Bytes, ohne externe Bibliotheken:']],
['limits','Grenzen',['Metadaten lassen sich entfernen oder fälschen. Fehlende Hinweise beweisen keine Echtheit, ein einzelner Hinweis keine Manipulation. Identitäten sind Angaben der Datei. Dateisystemdaten betreffen Ihre Kopie.','Sehr große Dateien können den Browserspeicher übersteigen. Manche Formate (HEIC) werden analysiert, aber nicht überall angezeigt. Zertifikatsprüfung und Zuordnung erfordern Spezialuntersuchungen.']],
['faq','FAQ und Support',['- Werden meine Dateien gesendet? Nein, alles läuft lokal.\n- Bleibt der Fall nach dem Schließen? Ja, in diesem Browser, bis „Fall löschen“.\n- Warum hat ein WhatsApp-Foto keine Metadaten? Messenger entfernen sie.\n- Warum weichen zwei Zeiten um Stunden ab? Eine ist UTC, die andere ohne Zeitzone (Zeichen ⧗).\n- Wie erhalte ich ein PDF? HTML-Bericht herunterladen und als PDF drucken.\n- Support: Diagnose unter „Über & Versionen“ kopieren (ohne Dateiinhalte) und beifügen.']],
['trouble','Fehlerbehebung',['- Download oder Druck reagiert nicht: manche eingebettete Ansichten blockieren das; Kopieren nutzen oder die eigenständige Datei im Browser öffnen.\n- Audio oder Video wird nicht dekodiert: Codec fehlt; die Strukturanalyse bleibt vollständig.\n- Langsam: sehr große Dateien brauchen Zeit.\n- Ein Sprachwechsel analysiert alle Elemente automatisch neu.']],
['versions','Versionen',['Omega 1.0.0 (24.11.2026), stabiler Kanal — erste vollständige Version: Betriebssystem-Oberfläche, 15 Werkzeuge, Engines für Bilder, Audio, Video, PDF, Office, E-Mail, Chats und Text, regelbasierte Interpretation, Korrelation, Zeitachse, Geolokalisierung, Labore, Beweismittelkette und Berichte in sieben Sprachen.','Komponentenversionen stehen unter „Über & Versionen“.']],
['shortcuts','Tastenkürzel',['- Strg/⌘ + Umschalt + O: Beweismittel hinzufügen\n- Strg/⌘ + Umschalt + D: Übersicht · E: Beweismittel · I: Inspektor · T: Zeitachse · M: Karte · R: Berichte · H: Handbuch\n- Esc: Startmenü oder Vorschau schließen']]
],
es:[
['intro','Introducción',['Omega es una estación de peritaje forense que funciona íntegramente en el navegador. Examina textos, correos, chats, audio, vídeo, imágenes, fotografías, PDF y documentos de oficina, y convierte lo que encuentra en hallazgos, conclusiones, una línea de tiempo común e informes completos.','Está organizado como un sistema operativo: cada herramienta es una aplicación en su propia ventana y todas comparten el mismo caso. No se sube nada: los archivos nunca salen de su dispositivo.']],
['start','Primeros pasos',['- Abra Ajustes y complete título y número del caso, perito e institución.\n- Añada evidencias arrastrando archivos a cualquier parte o con «Añadir evidencias».\n- Cada archivo recibe hashes (MD5, SHA-1, SHA-256, CRC-32), se identifica por su firma y se analiza automáticamente.\n- El Inspector muestra hallazgos y conclusiones, la Línea de tiempo el orden de los hechos e Informes permite emitir el dictamen.']],
['desktop','Escritorio, ventanas y barra',['Haga doble clic en un icono para abrir una herramienta (un toque en pantallas táctiles). Las ventanas se mueven por la barra de título, se redimensionan por la esquina inferior derecha y se maximizan con doble clic en el título.','La barra de tareas muestra las ventanas abiertas. El botón Inicio lista todas las herramientas con búsqueda, idioma y tema. En el móvil cada ventana se abre a pantalla completa.']],
['evidence','Evidencias e Inspector',['La ventana Evidencias lista los elementos con tipo, tamaño, veredicto de integridad y SHA-256. Haga clic en una fila para abrirla en el Inspector. Eliminar requiere confirmación y queda registrado.','El Inspector tiene ocho pestañas: Resumen, Hallazgos (con explicación), Metadatos (todos los campos por fuente, con búsqueda), Eventos, Identidades, Ubicaciones, Hashes (con verificación) y Notas.']],
['timeline','Línea de tiempo',['La Línea de tiempo reúne todos los eventos fechados de todos los archivos, un carril por archivo. Los colores indican el tipo de evento; los puntos huecos son horas sin zona horaria.','Amplíe con la rueda, el pellizco o los botones; arrastre para desplazarse; toque un punto para ver detalles y los eventos de otros archivos en la ventana de correlación. Debajo: anomalías, grupos de eventos casi simultáneos y la lista completa exportable a CSV.']],
['map','Geolocalización',['Todas las posiciones GPS encontradas se dibujan en una cuadrícula local con escala, numeradas cronológicamente y unidas por la ruta. La tabla muestra coordenadas, hora, distancia y enlace a OpenStreetMap. No se carga ningún mapa externo en la aplicación.']],
['labs','Laboratorios de imagen, audio y vídeo',['Imagen: Original, ELA, Ruido, Bordes, Histograma, Detección de clones y comparación con la miniatura EXIF.','Audio: decodifica el sonido (también de vídeos) y muestra pico, RMS, saturación, forma de onda y espectrograma, marcando discontinuidades, silencios digitales y silencios largos.','Vídeo: avance fotograma a fotograma, captura y análisis automático de cortes bruscos y tramos congelados.','En cada laboratorio puede guardar una observación con gravedad e imagen; se convierte en hallazgo y aparece en el informe.']],
['hex','Hex y cadenas',['Muestra los bytes en bruto (offset, hex, texto) con búsqueda y salto a offset. Las demás pestañas muestran cadenas legibles, la entropía por bloque y las firmas de archivo incrustadas.']],
['compare','Comparador',['Elija dos elementos para comparar hashes, tamaños y metadatos lado a lado. Dos imágenes generan un mapa de diferencias; dos textos, una comparación línea a línea.']],
['report','Informes y exportación',['Elija el idioma del informe (cualquiera de los siete), las secciones y los elementos. Vista previa lo muestra; Descargar guarda un HTML autónomo imprimible en PDF; Copiar lo deja en el portapapeles. Cada informe queda registrado con su SHA-256.','La exportación JSON contiene todo el caso; importarla restaura notas y observaciones de los archivos con el mismo SHA-256.']],
['custody','Cadena de custodia',['Cada acción se registra con hora, perito y un hash SHA-256 enlazado con la entrada anterior. «Verificar integridad» recalcula la cadena; cualquier cambio la rompe en ese punto.']],
['interpret','Interpretación de hallazgos',['Alto: fuerte indicio de alteración, inconsistencia o riesgo. Medio: procesamiento o edición a revisar. Bajo: indicio débil. Informativo: contexto útil sin efecto en la puntuación.','La puntuación empieza en 100 y pierde 30 por hallazgo alto, 12 por medio y 4 por bajo. Lea los hallazgos en conjunto: varios indicios coincidentes pesan mucho más que uno solo.']],
['formats','Formatos compatibles',['Los motores leen directamente los siguientes formatos, sin bibliotecas externas:']],
['limits','Limitaciones',['Los metadatos pueden eliminarse o falsificarse. La ausencia de indicadores no prueba autenticidad, y un indicador aislado no prueba manipulación. Las identidades son las que declara el archivo. Las fechas del sistema corresponden a su copia.','Archivos muy grandes pueden superar la memoria del navegador. Algunos formatos (HEIC) se analizan pero no siempre se muestran. La validación de certificados y la atribución requieren exámenes especializados.']],
['faq','Preguntas frecuentes y soporte',['- ¿Se envían mis archivos? No, todo es local.\n- ¿El caso permanece al cerrar? Sí, en este navegador, hasta «Borrar caso».\n- ¿Por qué una foto de WhatsApp no tiene metadatos? Las apps de mensajería los eliminan.\n- ¿Por qué dos horas difieren varias horas? Una está en UTC y otra sin zona (marca ⧗).\n- ¿Cómo obtengo un PDF? Descargue el informe HTML e imprímalo como PDF.\n- Soporte: copie el diagnóstico en «Acerca de y versiones» (sin contenido de archivos) y adjúntelo.']],
['trouble','Solución de problemas',['- Descargar o imprimir no funciona: algunos visores integrados lo bloquean; use Copiar o abra el archivo autónomo en el navegador.\n- El audio o vídeo no se decodifica: falta el códec; el análisis estructural sigue completo.\n- Lentitud: los archivos muy grandes requieren tiempo.\n- Cambiar el idioma reanaliza automáticamente todos los elementos.']],
['versions','Versiones',['Omega 1.0.0 (24/11/2026), canal estable — primera versión completa: interfaz de sistema operativo, 15 herramientas, motores para imágenes, audio, vídeo, PDF, documentos, correo, chats y texto, interpretación por reglas, correlación, línea de tiempo, geolocalización, laboratorios, cadena de custodia e informes en siete idiomas.','Las versiones de los componentes figuran en «Acerca de y versiones».']],
['shortcuts','Atajos de teclado',['- Ctrl/⌘ + Mayús + O: añadir evidencias\n- Ctrl/⌘ + Mayús + D: panel · E: evidencias · I: inspector · T: línea de tiempo · M: mapa · R: informes · H: manual\n- Esc: cierra el menú Inicio o una vista previa']]
]};

/* ================= PARSERS ================= */
function newR(){return {groups:{},events:[],ids:[],locs:[],findings:[],dims:null,thumb:null,xmp:0,flags:{},attach:[],sw:[]}}
function put(R,g,k,v){
  if(v===undefined||v===null||v===''||(typeof v==='number'&&!isFinite(v)))return;
  if(typeof v==='string'){v=v.replace(/\u0000+$/,'');if(v.length>4000)v=v.slice(0,4000)+'…';if(!v.trim())return}
  const G=R.groups[g]||(R.groups[g]={});
  if(G[k]!==undefined){if(G[k]===v)return;let i=2;while(G[k+' #'+i]!==undefined){if(G[k+' #'+i]===v)return;i++}G[k+' #'+i]=v}else G[k]=v;
}
function addEv(R,kind,d,label,src,o={}){
  if(!d)return;const ms=typeof d==='number'?d:d.ms;if(ms==null||!isFinite(ms))return;
  const y=new Date(ms).getUTCFullYear();if(y<1971||y>2100)return;
  R.events.push({kind,ts:ms,label,lp:o.lp||null,src,detail:o.detail||'',floating:typeof d==='object'?!!d.floating:!!o.floating,conf:o.conf||'high'});
}
function addId(R,role,value,src){value=String(value==null?'':value).replace(/\s+/g,' ').trim();if(!value||value.length>300||/^[\s\-_.0]*$/.test(value))return;if(R.ids.some(x=>x.role===role&&x.value===value))return;R.ids.push({role,value,src})}
function addLoc(R,lat,lon,src,o={}){lat=+lat;lon=+lon;if(!isFinite(lat)||!isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180||(lat===0&&lon===0))return;if(R.locs.some(l=>Math.abs(l.lat-lat)<1e-7&&Math.abs(l.lon-lon)<1e-7))return;R.locs.push({lat,lon,alt:o.alt,src,ts:o.ts||null})}
function addF(R,sev,key,p={}){const k=key+JSON.stringify(p);if(R.findings.some(f=>f._k===k))return;R.findings.push({sev,key,p,_k:k})}

function tlTicks(t0,t1,maxN){
  const span=t1-t0;const step=TSTEPS.find(s=>span/stepMs(s)<=maxN)||'100Y';const out=[];const utc=S.settings.tz==='utc';
  if(typeof step==='number'){const off=utc?0:new Date(t0).getTimezoneOffset()*60000;let k=Math.ceil((t0-off)/step)*step+off;let g=0;while(k<=t1&&g++<500){out.push(k);k+=step}}
  else{const n=parseInt(step),y=step.endsWith('Y');const d=new Date(t0);const Y=utc?d.getUTCFullYear():d.getFullYear(),M=utc?d.getUTCMonth():d.getMonth();

  for(const f of arr){const ev={id:uid(),file:f,name:f.name,size:f.size,added:Date.now(),status:'queue',notes:'',obs:[]};S.evidence.push(ev);fresh.push(ev);DB.put('files',ev.id,{name:f.name,type:f.type,lastModified:f.lastModified,blob:f})}
  BUS.emit('change');if(!WM.wins.evidence&&!WM.wins.overview)openApp('evidence');toast(t('ui.analyzing',{n:arr.length}));
  for(const ev of fresh){await analyzeEvidence(ev);crossCheck();await logC('c.added',ev.name,ev.hashes?'SHA-256 '+ev.hashes.sha256+' · '+ev.size+' bytes · '+(ev.det?ev.det.label:''):(ev.err||''));BUS.emit('change')}
  saveCase();toast(t('ui.analyzed',{n:arr.length}));
}
function removeEvidence(id){const i=S.evidence.findIndex(e=>e.id===id);if(i<0)return;const ev=S.evidence[i];S.evidence.splice(i,1);if(ev.url)URL.revokeObjectURL(ev.url);if(ev.thumbURL)URL.revokeObjectURL(ev.thumbURL);DB.del('files',id);
  logC('c.removed',ev.name,ev.hashes?'SHA-256 '+ev.hashes.sha256:'');crossCheck();saveCase();BUS.emit('change')}
async function restore(){
  const meta=await DB.get('kv','case');const files=await DB.all('files');if(meta&&Array.isArray(meta.custody))S.custody=meta.custody;
  for(const [id,v] of files){if(!v||!v.blob)continue;const f=v.blob instanceof File?v.blob:new File([v.blob],v.name,{type:v.type,lastModified:v.lastModified});const m=((meta&&meta.ev)||[]).find(x=>x.id===id)||{};
    S.evidence.push({id,file:f,name:v.name,size:f.size,added:m.added||Date.now(),status:'queue',notes:m.notes||'',obs:m.obs||[]})}
  S.evidence.sort((a,b)=>a.added-b.added);BUS.emit('change');
  for(const ev of S.evidence)await analyzeEvidence(ev);crossCheck();BUS.emit('change');
  if(S.evidence.length){logC('c.session','',t('ui.restored',{n:S.evidence.length}));toast(t('ui.restored',{n:S.evidence.length}))}
}
let rafPending=false;
BUS.on('change',()=>{if(rafPending)return;rafPending=true;requestAnimationFrame(()=>{rafPending=false;refreshAll('change')})});
BUS.on('custody',()=>refreshAll('custody'));
function buildWatermark(){let r='';for(let i=0;i<36;i++){const a=i*Math.PI/18,l=i%2?150:205;r+=`<path d="M${210+Math.cos(a)*118} ${200+Math.sin(a)*118}L${210+Math.cos(a)*l} ${200+Math.sin(a)*l}" stroke-width="${i%2?2:3}"/>`}
  return `<svg id="wm" viewBox="0 0 420 420" fill="none" stroke="#c9a55c" stroke-linecap="round">${r}<circle cx="210" cy="200" r="100" stroke-width="1.5" opacity=".6"/><path d="M118 300h62v-26a78 78 0 1 1 60 0v26h62" stroke-width="16" stroke-linejoin="round"/></svg>`}
function boot(){
  loadSettings();
  $('#desk').insertAdjacentHTML('afterbegin',buildWatermark());
  $('#startbtn').insertAdjacentHTML('afterbegin',icon('logo'));
  renderDesk();tick();setInterval(tick,15000);
  document.addEventListener('pointerdown',e=>{lastPtr=e.pointerType||'mouse';if(!e.target.closest('#start')&&!e.target.closest('#startbtn'))closeStart()},true);
  document.addEventListener('click',e=>{
    const op=e.target.closest('[data-open]');if(op){e.preventDefault();const a=op.dataset.arg;openApp(op.dataset.open,a===undefined?undefined:a);return}
    if(e.target.closest('[data-act="add"]')){e.preventDefault();$('#fi').click();return}
    const tk=e.target.closest('[data-task]');if(tk){const id=tk.dataset.task,w=WM.wins[id];if(w.min||WM.focus!==id){w.min=false;w.el.classList.remove('hide');focusWin(id)}else minWin(id);return}
    const di=e.target.closest('[data-dicon]');if(di&&(lastPtr!=='mouse'||e.detail===0||isCompact())){openApp(di.dataset.dicon);return}
  });
  document.addEventListener('dblclick',e=>{const di=e.target.closest('[data-dicon]');if(di&&lastPtr==='mouse')openApp(di.dataset.dicon)});
  $('#startbtn').onclick=toggleStart;$('#langsel').onchange=e=>setLang(e.target.value);
  $('#fi').onchange=e=>{addFiles(e.target.files);e.target.value=''};
  let dc=0;const drop=$('#drop');
  addEventListener('dragenter',e=>{if(e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes('Files')){dc++;drop.classList.add('on')}});
  addEventListener('dragleave',()=>{dc=Math.max(0,dc-1);if(!dc)drop.classList.remove('on')});
  addEventListener('dragover',e=>e.preventDefault());
  addEventListener('drop',e=>{e.preventDefault();dc=0;drop.classList.remove('on');if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});
  addEventListener('keydown',e=>{
    if(e.key==='Escape'){closeStart();const o=$('.overlay');if(o)o.remove();return}
    if((e.ctrlKey||e.metaKey)&&e.shiftKey){const k=e.key.toLowerCase();const map={o:null,e:'evidence',t:'timeline',r:'report',h:'manual',m:'map',i:'inspector',d:'overview'};if(k in map){e.preventDefault();if(k==='o')$('#fi').click();else openApp(map[k])}}
    if(e.key==='Meta'&&false)toggleStart();
  });
  addEventListener('resize',debounce(fitWindows,150));
  new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;const tb=c.closest('table');const hr=tb.tHead&&tb.tHead.rows[0];c.dataset.l=hr&&hr.cells[i]?hr.cells[i].textContent.trim():''}}).observe(document.body,{childList:true,subtree:true});
  if(!isCompact())openApp('overview');
  restore().then(()=>{if(isCompact()&&!Object.keys(WM.wins).length)openApp('overview')});
}
document.addEventListener('DOMContentLoaded',boot);

</script></body></html>
