<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Omega</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%238f2c45%27/%3E%3Cpath d=%27M4 20h5.2v-2.3a7 7 0 1 1 5.6 0V20H20%27 fill=%27none%27 stroke=%27%23f6ead3%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E"><style>
/*
VOICE: steady, exact, quietly defiant — the workstation of independent investigators.
IDEA: Omega (Ω), the last letter: the final word belongs to the evidence; a light kept burning at night.
PICTURE: the desktop as a night sky with a rising dawn; a radiant Ω watermark; live windows.
COLOUR and TYPE: graphite ground, wine field, brass accent; serif display + system sans + mono data.
LAYOUT: desktop icons left, overlapping windows, taskbar bottom; phones get full-screen windows.
*/
:root{
  --bg:#0f0d10;--bg2:#17141a;--panel:#1c181f;--panel2:#241f28;--line:#352d3a;--line2:#4a3f50;
  --ink:#ece6dc;--ink2:#b9afa3;--ink3:#8a8078;--brass:#c9a55c;--brass2:#e3c886;--wine:#6e1f33;--wine2:#8f2c45;
  --ok:#6fae7a;--low:#b7a35a;--med:#d98a3d;--high:#d9534f;--info:#6d93c6;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:10px;--shadow:0 18px 50px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
  color-scheme:dark;
}
:root[data-ui=light]{
  --bg:#e9e4dc;--bg2:#f4f0ea;--panel:#fbf9f5;--panel2:#f1ece4;--line:#d9d0c4;--line2:#c3b7a7;
  --ink:#1d1a17;--ink2:#4a433c;--ink3:#7a7067;--brass:#8a6a25;--brass2:#6d5218;--wine:#7d2238;--wine2:#962c47;
  --shadow:0 18px 40px rgba(60,40,20,.18),0 2px 6px rgba(60,40,20,.12);color-scheme:light;
}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
a{color:var(--brass2)}
.mono{font-family:var(--mono)}
.muted{color:var(--ink3)}
.small{font-size:12px}
.hide{display:none!important}

/* desktop */
#desk{position:fixed;inset:0 0 48px 0;overflow:hidden;
  background:
   radial-gradient(1200px 700px at 78% 20%,rgba(143,44,69,.38),transparent 60%),
   radial-gradient(1500px 520px at 50% 118%,rgba(227,200,134,.22),rgba(201,120,60,.08) 45%,transparent 72%),
   radial-gradient(900px 600px at 10% 90%,rgba(201,165,92,.10),transparent 60%),
   linear-gradient(160deg,var(--bg2),var(--bg));}
:root[data-ui=light] #desk{background:radial-gradient(1100px 700px at 80% 15%,rgba(150,44,71,.16),transparent 60%),linear-gradient(160deg,var(--bg2),var(--bg))}
#desk::before{content:"";position:absolute;inset:0;opacity:.07;pointer-events:none;
  background-image:linear-gradient(var(--brass) 1px,transparent 1px),linear-gradient(90deg,var(--brass) 1px,transparent 1px);background-size:48px 48px}
#wm{position:absolute;right:3vw;bottom:2vh;width:min(48vw,560px);opacity:.17;pointer-events:none}
#brand{position:absolute;right:4vw;top:4vh;text-align:right;pointer-events:none}
#brand h1{font:600 clamp(28px,4vw,46px)/1.05 var(--serif);margin:0;color:var(--brass2);letter-spacing:.01em}
#brand p{margin:6px 0 0;color:var(--ink2);font-size:14px;max-width:34ch;margin-left:auto}
#brand .mark{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:18px;background:linear-gradient(160deg,var(--wine2),var(--wine));box-shadow:0 0 0 1px rgba(227,200,134,.35),0 10px 40px rgba(227,200,134,.18);margin-bottom:10px}
#brand .mark svg{width:38px;height:38px;stroke:#f6ead3;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.motto{font:italic 600 16px var(--serif);color:var(--brass2)!important;letter-spacing:.02em}
.omega{font-family:var(--serif);color:var(--brass2)}
#icons{position:absolute;left:12px;top:12px;bottom:12px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,92px);grid-auto-columns:96px;gap:4px;align-content:start}
.dicon{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:10px;border:1px solid transparent;background:none;color:var(--ink);text-align:center;font-size:12px;line-height:1.2}
.dicon:hover,.dicon:focus-visible{background:rgba(201,165,92,.1);border-color:rgba(201,165,92,.25)}
.dicon .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line2);box-shadow:0 6px 14px rgba(0,0,0,.35)}
.dicon svg,.ic svg{width:24px;height:24px;stroke:var(--brass2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#drop{position:fixed;inset:0;z-index:99999;background:rgba(15,13,16,.82);display:none;place-items:center;border:3px dashed var(--brass);color:var(--brass2);font:600 26px var(--serif)}
#drop.on{display:grid}

/* taskbar */
#bar{position:fixed;left:0;right:0;bottom:0;height:48px;display:flex;align-items:center;gap:6px;padding:0 8px;background:rgba(23,20,26,.94);border-top:1px solid var(--line);z-index:50000;backdrop-filter:blur(8px)}
:root[data-ui=light] #bar{background:rgba(251,249,245,.95)}
#startbtn{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:linear-gradient(160deg,var(--wine2),var(--wine));color:#f6ead3;font-weight:600}
#startbtn svg{width:18px;height:18px;stroke:#f6ead3;fill:none;stroke-width:1.8}
#tasks{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
#tasks::-webkit-scrollbar{display:none}
.task{flex:none;display:flex;align-items:center;gap:6px;height:36px;max-width:190px;padding:0 10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task svg{width:16px;height:16px;flex:none;stroke:var(--brass2);fill:none;stroke-width:1.7}
.task.on{background:var(--panel2);border-color:var(--line2);color:var(--ink)}
.task.min{opacity:.6}
#tray{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:12px}
#tray select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px;height:32px}
#clock{font-family:var(--mono);text-align:right;line-height:1.2;white-space:nowrap}

/* start menu */
#start{position:fixed;left:8px;bottom:56px;width:min(560px,calc(100vw - 16px));max-height:calc(100vh - 72px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);z-index:60000;padding:16px;display:none}
#start.on{display:block}
#start h2{font:600 22px var(--serif);margin:0 0 2px;color:var(--brass2)}
#start input{width:100%;margin:10px 0 12px;padding:10px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);font-size:16px}
#startgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.sapp{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;border:1px solid transparent;background:none;text-align:left;color:var(--ink)}
.sapp:hover,.sapp:focus-visible{background:var(--panel2);border-color:var(--line)}
.sapp .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--line);flex:none}
.sapp .ic svg{width:18px;height:18px}
.sapp small{display:block;color:var(--ink3);font-size:11px;line-height:1.25}

/* windows */
.win{position:absolute;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;min-width:300px;min-height:200px}
.win.focus{border-color:var(--brass)}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.tb{display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 12px;background:linear-gradient(180deg,var(--panel2),var(--panel));border-bottom:1px solid var(--line);cursor:grab;user-select:none;touch-action:none;flex:none}
.tb .ti{flex:1;display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb .ti svg{width:16px;height:16px;stroke:var(--brass2);fill:none;stroke-width:1.7;flex:none}
.wb{display:flex;gap:2px}
.wb button{width:34px;height:30px;border:0;border-radius:6px;background:transparent;color:var(--ink2);display:grid;place-items:center}
.wb button:hover{background:var(--line)}
.wb button.x:hover{background:var(--high);color:#fff}
.wb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.wc{flex:1;overflow:auto;padding:14px;position:relative}
.wc.nopad{padding:0}
.rs{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,var(--line2) 50%,var(--line2) 60%,transparent 60%,transparent 70%,var(--line2) 70%,var(--line2) 80%,transparent 80%)}

/* common UI */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--brass)}
.btn.pri{background:linear-gradient(160deg,var(--wine2),var(--wine));border-color:var(--wine2);color:#f8ecd6}
.btn.gold{background:var(--brass);border-color:var(--brass);color:#1b1408}
.btn.sm{min-height:30px;padding:3px 9px;font-size:12px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.btn:disabled{opacity:.45;cursor:not-allowed}
input.in,select.in,textarea.in{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;min-height:36px;font-size:14px}
textarea.in{width:100%;min-height:90px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
h3.h{font:600 19px/1.2 var(--serif);margin:4px 0 10px;color:var(--brass2)}
h4.h{font-size:13px;margin:16px 0 6px;color:var(--ink);text-transform:none;letter-spacing:0}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stat b{display:block;font:600 26px/1.1 var(--serif);color:var(--brass2)}
.stat span{color:var(--ink2);font-size:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:600;color:var(--ink2);border-bottom:1px solid var(--line2);padding:6px 8px;position:sticky;top:0;background:var(--panel);z-index:1}
table.t td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top;overflow-wrap:anywhere}
table.t tr.sel td{background:rgba(201,165,92,.12)}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:rgba(201,165,92,.06)}
table.kv td:first-child{color:var(--ink2);width:38%;font-family:var(--mono);font-size:12px}
table.kv td:last-child{font-family:var(--mono);font-size:12px;white-space:pre-wrap}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.sev-high{color:var(--high)}.sev-med{color:var(--med)}.sev-low{color:var(--low)}.sev-info{color:var(--info)}.sev-ok{color:var(--ok)}
.score{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;font:600 15px var(--mono);border:3px solid currentColor}
.finding{border-left:3px solid currentColor;padding:8px 12px;margin:6px 0;background:var(--bg2);border-radius:0 8px 8px 0}
.finding b{color:var(--ink)}
.finding p{margin:3px 0 0;color:var(--ink2);font-size:12.5px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 12px;overflow-x:auto;scrollbar-width:thin}
.tabs button{flex:none;border:0;background:none;padding:9px 12px;color:var(--ink2);border-bottom:2px solid transparent}
.tabs button.on{color:var(--brass2);border-color:var(--brass)}
details.grp{border:1px solid var(--line);border-radius:8px;margin:6px 0;background:var(--bg2)}
details.grp summary{padding:8px 12px;cursor:pointer;font-weight:600}
details.grp>div{padding:0 8px 8px;max-height:420px;overflow:auto}
.dz{border:2px dashed var(--line2);border-radius:12px;padding:26px;text-align:center;color:var(--ink2);background:rgba(201,165,92,.04)}
.dz.on{border-color:var(--brass);color:var(--brass2)}
.dz b{display:block;font:600 18px var(--serif);color:var(--ink);margin-bottom:4px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;height:100%}
.bars .b{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;font-size:12px;margin:4px 0}
.bars .b i{display:block;height:10px;border-radius:5px;background:var(--brass)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brass);width:0;transition:width .2s}
.canvasbox{position:relative;background:#09080a;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.canvasbox canvas{display:block;width:100%;height:auto}
.tip{position:fixed;z-index:70000;pointer-events:none;background:var(--panel);border:1px solid var(--brass);border-radius:8px;padding:8px 10px;font-size:12px;max-width:320px;box-shadow:var(--shadow)}
.empty{padding:28px;text-align:center;color:var(--ink3)}
.empty b{display:block;font:600 18px var(--serif);color:var(--ink2);margin-bottom:6px}
#toasts{position:fixed;right:12px;bottom:58px;display:flex;flex-direction:column;gap:6px;z-index:80000;max-width:min(360px,calc(100vw - 24px))}
.toast{background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--brass);border-radius:8px;padding:10px 12px;box-shadow:var(--shadow);font-size:13px;animation:tin .25s ease}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.prog i{transition:none}}
.hexv{font:12px/18px var(--mono);white-space:pre;position:relative}
.hexv .r{height:18px}
.hexv .o{color:var(--brass)}
.hexv mark{background:var(--wine2);color:#fff}
.man h2{font:600 24px/1.15 var(--serif);color:var(--brass2);margin:0 0 10px}
.man h3{font:600 17px var(--serif);margin:18px 0 6px;color:var(--ink)}
.man p,.man li{color:var(--ink2);max-width:72ch}
.mannav{display:flex;flex-direction:column;gap:2px}
.mannav button{text-align:left;border:0;background:none;padding:7px 10px;border-radius:7px;color:var(--ink2)}
.mannav button.on{background:var(--panel2);color:var(--brass2)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line2);background:var(--bg2);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--ink2);min-height:28px}
.chip.on{border-color:var(--brass);color:var(--ink)}
.overlay{position:fixed;inset:0;z-index:90000;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:12px}
.overlay .box{background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:min(1000px,100%);height:min(90vh,100%);display:flex;flex-direction:column;overflow:hidden}
.overlay iframe{flex:1;border:0;background:#fff;width:100%}
.lh{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:12px;height:100%}

@media (max-width:760px){
  #icons{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,84px);grid-template-rows:none;grid-auto-rows:92px;right:12px;bottom:auto;justify-content:start}
  #brand{display:none}
  #wm{width:80vw;right:10vw}
  .win{border-radius:0}
  .split,.lh{grid-template-columns:minmax(0,1fr);height:auto}
  #tray .lang{display:none}
  #clock{font-size:11px}
  .bars .b{grid-template-columns:80px 1fr 34px}
  table.t{font-size:12px}
  input.in,select.in,textarea.in{font-size:16px}
}

/* ===== responsive layer ===== */
.tsplit{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:12px}
.tlist{max-height:70vh;overflow:auto}
@media (max-width:760px){.tsplit{grid-template-columns:minmax(0,1fr)}.tlist{max-height:200px}}
:root{--bar:48px;--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px)}
#desk{bottom:calc(var(--bar) + var(--safe-b));left:var(--safe-l);right:var(--safe-r)}
#bar{height:calc(var(--bar) + var(--safe-b));padding-bottom:var(--safe-b);padding-left:calc(8px + var(--safe-l));padding-right:calc(8px + var(--safe-r))}
#start{bottom:calc(var(--bar) + var(--safe-b) + 8px);max-height:calc(100dvh - var(--bar) - var(--safe-b) - 24px)}
#toasts{bottom:calc(var(--bar) + var(--safe-b) + 10px)}
.win.max .rs{display:none}
.win.max{box-shadow:none}
.cards{grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr))}
.tabs{scroll-snap-type:x proximity}.tabs button{scroll-snap-align:start}
.stat b{font-size:clamp(20px,2.2vw,30px)}
/* tables that become cards on phones */
@media (max-width:600px){
  table.t.stack thead{display:none}
  table.t.stack tr{display:grid;padding:8px 0;border-bottom:1px solid var(--line)}
  table.t.stack td{display:flow-root;border:0;padding:3px 4px;padding-inline-start:7.5em;text-align:start}
  table.t.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--ink3);font-family:var(--sans);font-size:11px;white-space:normal}
  table.t.stack td:empty{display:none}
  table.t.stack td[data-l=""]{padding-inline-start:4px}table.t.stack td[data-l=""]::before{display:none}
  table.t.stack tr.sel{background:rgba(201,165,92,.1)}table.t.stack td{background:none!important}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;scroll-snap-type:x proximity}
  .chips::-webkit-scrollbar{display:none}.chip{flex:none;scroll-snap-align:start}
  .wc{padding:10px}
  .row{gap:6px}
  h3.h{font-size:17px}
  .mannav{flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:4px;padding-bottom:4px}
  .mannav button{flex:none;white-space:nowrap;border:1px solid var(--line)}
  .lh>.col{position:sticky;top:-10px;background:var(--panel);z-index:2;padding-top:4px}
  .split{gap:10px}
  .finding{padding:7px 10px}
  .overlay{padding:0}.overlay .box{height:100%;border-radius:0}
}
@media (max-width:520px){
  #clock br,#clock .muted{display:none}
  #clock{font-size:12px}
  .task{max-width:46px;padding:0 13px}.task span{display:none}
  .bars .b{grid-template-columns:72px 1fr 28px}
  .score{width:38px;height:38px;font-size:13px}
}
@media (max-width:360px){
  #startlbl{display:none}#startbtn{padding:0 10px}
  .tb .ti{font-size:13px}.wb button{width:30px}
  .btn{padding:6px 9px}
}
/* short screens (landscape phones) */
@media (max-height:520px){
  #brand{display:none}
  #icons{grid-template-rows:repeat(auto-fill,82px)}
  .dicon .ic{width:38px;height:38px}
}
/* touch */
@media (pointer:coarse){
  .wb button{min-width:40px;height:38px}
  .tb{height:46px}
  .btn{min-height:42px}.btn.sm{min-height:36px}
  .chip{min-height:34px}
  .tabs button{padding:11px 14px}
  .mannav button{padding:10px 12px}
  .rs{width:28px;height:28px}
  table.t tr.click td{padding-top:9px;padding-bottom:9px}
}
/* large and very large screens */
@media (min-width:1800px){
  body{font-size:15px}

'ab.identity':['Omega was made for independent investigators — journalists, experts, researchers and citizens who keep looking when others stop. Ω is the last letter of the Greek alphabet: the final word belongs to the evidence. Free of third parties, servers and tracking, it keeps the work in your hands.','O Omega foi feito para investigadores independentes — jornalistas, peritos, pesquisadores e cidadãos que continuam procurando quando outros desistem. Ω é a última letra do alfabeto grego: a palavra final pertence às evidências. Livre de terceiros, servidores e rastreamento, mantém o trabalho nas suas mãos.','Omega a été conçu pour les enquêteurs indépendants — journalistes, experts, chercheurs et citoyens qui continuent à chercher quand d’autres s’arrêtent. Ω est la dernière lettre de l’alphabet grec : le dernier mot revient aux preuves. Sans tiers, serveurs ni pistage, il laisse le travail entre vos mains.','Omega è nato per gli investigatori indipendenti — giornalisti, periti, ricercatori e cittadini che continuano a cercare quando altri si fermano. Ω è l’ultima lettera dell’alfabeto greco: l’ultima parola spetta alle prove. Senza terzi, server né tracciamento, lascia il lavoro nelle tue mani.','Omega powstała dla niezależnych badaczy — dziennikarzy, biegłych, naukowców i obywateli, którzy szukają dalej, gdy inni przestają. Ω to ostatnia litera alfabetu greckiego: ostatnie słowo należy do dowodów. Bez firm trzecich, serwerów i śledzenia — praca zostaje w Twoich rękach.','Omega wurde für unabhängige Ermittler geschaffen — Journalisten, Sachverständige, Forschende und Bürger, die weitersuchen, wenn andere aufhören. Ω ist der letzte Buchstabe des griechischen Alphabets: Das letzte Wort gehört den Beweisen. Ohne Dritte, Server und Tracking bleibt die Arbeit in Ihren Händen.','Omega se creó para investigadores independientes — periodistas, peritos, investigadores y ciudadanos que siguen buscando cuando otros se detienen. Ω es la última letra del alfabeto griego: la última palabra pertenece a las pruebas. Sin terceros, servidores ni rastreo, mantiene el trabajo en sus manos.'],

'ov.intro':['Add the files of a case. Each one is hashed, its structure and metadata are read, findings are interpreted and every date joins one common timeline.','Adicione os arquivos de um caso. Cada um recebe hash, tem a estrutura e os metadados lidos, os achados interpretados e todas as datas entram numa linha do tempo comum.','Ajoutez les fichiers d’un dossier. Chacun est haché, sa structure et ses métadonnées sont lues, les constats interprétés et toutes les dates rejoignent une chronologie commune.','Aggiungi i file di un caso. Ognuno viene sottoposto a hash, struttura e metadati vengono letti, i rilievi interpretati e ogni data entra in un’unica cronologia.','Dodaj pliki sprawy. Każdy otrzymuje skrót, jego struktura i metadane są odczytywane, ustalenia interpretowane, a wszystkie daty trafiają na wspólną oś czasu.','Fügen Sie die Dateien eines Falls hinzu. Jede wird gehasht, Struktur und Metadaten werden gelesen, Befunde interpretiert und alle Daten auf einer gemeinsamen Zeitachse vereint.','Añada los archivos de un caso. Cada uno se somete a hash, se leen su estructura y metadatos, se interpretan los hallazgos y todas las fechas se unen en una línea de tiempo común.'],
'ov.step1':['Fill in the case and investigator in Settings.','Preencha o caso e o perito em Configurações.','Renseignez le dossier et l’enquêteur dans Paramètres.','Compila caso e perito in Impostazioni.','Uzupełnij sprawę i biegłego w Ustawieniach.','Fall und Ermittler in den Einstellungen eintragen.','Complete el caso y el perito en Ajustes.'],
'ov.step2':['Add the evidence files (drag them anywhere).','Adicione os arquivos de evidência (arraste para qualquer lugar).','Ajoutez les fichiers (glissez-les n’importe où).','Aggiungi i file (trascinali ovunque).','Dodaj pliki dowodowe (przeciągnij w dowolne miejsce).','Beweisdateien hinzufügen (überallhin ziehen).','Añada los archivos (arrástrelos a cualquier parte).'],
'ov.step3':['Review findings in the Inspector, labs and Timeline.','Revise os achados no Inspetor, laboratórios e Linha do tempo.','Examinez les constats dans l’Inspecteur, les labos et la Chronologie.','Esamina i rilievi in Ispettore, laboratori e Cronologia.','Przejrzyj ustalenia w Inspektorze, laboratoriach i na Osi czasu.','Befunde im Inspektor, in den Laboren und der Zeitachse prüfen.','Revise los hallazgos en Inspector, laboratorios y Línea de tiempo.'],
'ov.step4':['Issue the report in any of the seven languages.','Emita o relatório em qualquer um dos sete idiomas.','Émettez le rapport dans l’une des sept langues.','Emetti il rapporto in una delle sette lingue.','Wygeneruj raport w jednym z siedmiu języków.','Bericht in einer der sieben Sprachen erstellen.','Emita el informe en cualquiera de los siete idiomas.'],
'ov.privacy':['Privacy: no file ever leaves this device. Nothing is uploaded and no external service is used.','Privacidade: nenhum arquivo sai deste dispositivo. Nada é enviado e nenhum serviço externo é usado.','Confidentialité : aucun fichier ne quitte cet appareil. Rien n’est envoyé, aucun service externe n’est utilisé.','Privacy: nessun file lascia questo dispositivo. Nulla viene caricato e non si usano servizi esterni.','Prywatność: żaden plik nie opuszcza tego urządzenia. Nic nie jest wysyłane, nie używa się usług zewnętrznych.','Datenschutz: Keine Datei verlässt dieses Gerät. Nichts wird hochgeladen, kein externer Dienst wird genutzt.','Privacidad: ningún archivo sale de este dispositivo. No se envía nada ni se usa ningún servicio externo.'],

'ins.findnote':['Findings are technical indicators, not proof by themselves. Interpret them together with the context of the case.','Os achados são indicadores técnicos, não provas por si sós. Interprete-os junto com o contexto do caso.','Les constats sont des indicateurs techniques, pas des preuves en soi. Interprétez-les avec le contexte du dossier.','I rilievi sono indicatori tecnici, non prove di per sé. Vanno interpretati con il contesto del caso.','Ustalenia są wskaźnikami technicznymi, a nie dowodami same w sobie. Interpretuj je w kontekście sprawy.','Befunde sind technische Hinweise, keine Beweise für sich. Im Kontext des Falls interpretieren.','Los hallazgos son indicadores técnicos, no pruebas por sí solos. Interprételos junto con el contexto del caso.'],

'ins.idnote':['Identities are what the file itself records (author fields, accounts, devices, senders). They show who or what the file claims, which may be changed by anyone with editing tools.','Identidades são o que o próprio arquivo registra (autoria, contas, dispositivos, remetentes). Mostram o que o arquivo declara, o que pode ser alterado por quem tiver ferramentas de edição.','Les identités sont celles que le fichier enregistre (auteur, comptes, appareils, expéditeurs). Elles indiquent ce que le fichier déclare, ce qui peut être modifié avec des outils d’édition.','Le identità sono quelle registrate dal file (autore, account, dispositivi, mittenti). Indicano ciò che il file dichiara, modificabile con strumenti di editing.','Tożsamości to dane zapisane w pliku (autor, konta, urządzenia, nadawcy). Pokazują, co plik deklaruje — można to zmienić narzędziami edycji.','Identitäten sind Angaben der Datei selbst (Autor, Konten, Geräte, Absender). Sie zeigen, was die Datei behauptet, und lassen sich mit Werkzeugen ändern.','Las identidades son lo que registra el propio archivo (autor, cuentas, dispositivos, remitentes). Muestran lo que el archivo declara, que puede alterarse con herramientas de edición.'],

'hx.entnote':['Each bar is a {b} block. Values near 8 bits/byte mean compressed or encrypted data; sudden high zones in a plain file may hide embedded content.','Cada barra é um bloco de {b}. Valores próximos de 8 bits/byte indicam dados comprimidos ou criptografados; zonas altas repentinas num arquivo simples podem esconder conteúdo embutido.','Chaque barre est un bloc de {b}. Des valeurs proches de 8 bits/octet signalent des données compressées ou chiffrées ; des zones hautes soudaines peuvent cacher du contenu.','Ogni barra è un blocco di {b}. Valori vicini a 8 bit/byte indicano dati compressi o cifrati; zone alte improvvise possono nascondere contenuto.','Każdy słupek to blok {b}. Wartości bliskie 8 bitów/bajt oznaczają dane skompresowane lub zaszyfrowane; nagłe wysokie strefy mogą ukrywać treść.','Jeder Balken ist ein Block von {b}. Werte nahe 8 Bit/Byte bedeuten komprimierte oder verschlüsselte Daten; plötzliche Spitzen können eingebettete Inhalte verbergen.','Cada barra es un bloque de {b}. Valores cercanos a 8 bits/byte indican datos comprimidos o cifrados; zonas altas repentinas pueden ocultar contenido.'],

'hx.signote':['File signatures found after the start of the file. They may be legitimate (thumbnails, embedded fonts, media) or appended/hidden files.','Assinaturas de arquivo encontradas após o início. Podem ser legítimas (miniaturas, fontes, mídias embutidas) ou arquivos anexados/ocultos.','Signatures de fichiers trouvées après le début. Elles peuvent être légitimes (miniatures, polices, médias) ou des fichiers ajoutés/cachés.','Firme di file trovate dopo l’inizio. Possono essere legittime (miniature, font, media) o file aggiunti/nascosti.','Sygnatury plików znalezione po początku pliku. Mogą być prawidłowe (miniatury, czcionki, media) lub dołączone/ukryte pliki.','Dateisignaturen nach dem Dateianfang. Sie können legitim sein (Vorschaubilder, Schriften, Medien) oder angehängte/versteckte Dateien.','Firmas de archivo halladas tras el inicio. Pueden ser legítimas (miniaturas, fuentes, medios) o archivos añadidos/ocultos.'],

'cu.intro':['Every action is recorded with time, examiner and a SHA-256 hash chained to the previous entry, so any later change to the log breaks the chain.','Toda ação é registrada com hora, perito e um hash SHA-256 encadeado ao registro anterior; qualquer alteração posterior quebra a cadeia.','Chaque action est consignée avec l’heure, l’expert et une empreinte SHA-256 chaînée à l’entrée précédente ; toute modification ultérieure rompt la chaîne.','Ogni azione è registrata con ora, perito e un hash SHA-256 concatenato alla voce precedente; qualsiasi modifica successiva spezza la catena.','Każda czynność jest zapisywana z czasem, biegłym i skrótem SHA-256 powiązanym z poprzednim wpisem; każda późniejsza zmiana przerywa łańcuch.','Jede Aktion wird mit Zeit, Sachverständigem und einem an den vorigen Eintrag gekoppelten SHA-256-Hash protokolliert; jede spätere Änderung bricht die Kette.','Cada acción se registra con hora, perito y un hash SHA-256 encadenado a la entrada anterior; cualquier cambio posterior rompe la cadena.'],

'set.storage':['Files, notes and the custody log are kept only in this browser (IndexedDB) so the case survives a reload. Clearing the case removes them.','Arquivos, notas e a cadeia de custódia ficam apenas neste navegador (IndexedDB), para o caso sobreviver a um recarregamento. Apagar o caso remove tudo.','Fichiers, notes et journal sont conservés uniquement dans ce navigateur (IndexedDB) pour survivre à un rechargement. Effacer le dossier les supprime.','File, note e registro restano solo in questo browser (IndexedDB) per sopravvivere a un ricaricamento. Cancellare il caso li rimuove.','Pliki, notatki i dziennik są przechowywane tylko w tej przeglądarce (IndexedDB), aby sprawa przetrwała odświeżenie. Wyczyszczenie sprawy je usuwa.','Dateien, Notizen und Protokoll bleiben nur in diesem Browser (IndexedDB), damit der Fall ein Neuladen übersteht. Fall löschen entfernt sie.','Archivos, notas y registro se guardan solo en este navegador (IndexedDB) para sobrevivir a una recarga. Borrar el caso los elimina.'],

'ab.privacytxt':['Omega is a single self-contained page. It uses no third-party code, fonts, maps or services, makes no network requests and never uploads files. All parsing, hashing and analysis happen in this browser.','O Omega é uma única página autossuficiente. Não usa código, fontes, mapas ou serviços de terceiros, não faz requisições de rede e nunca envia arquivos. Toda leitura, cálculo de hash e análise acontecem neste navegador.','Omega est une page unique autonome. Aucun code, police, carte ou service tiers, aucune requête réseau, aucun envoi de fichier. Tout se fait dans ce navigateur.','Omega è una singola pagina autonoma. Nessun codice, font, mappa o servizio di terzi, nessuna richiesta di rete, nessun caricamento di file. Tutto avviene in questo browser.','Omega to jedna samodzielna strona. Nie używa kodu, czcionek, map ani usług firm trzecich, nie wysyła żądań sieciowych i nigdy nie przesyła plików. Wszystko dzieje się w tej przeglądarce.','Omega ist eine einzige eigenständige Seite. Kein Fremdcode, keine fremden Schriften, Karten oder Dienste, keine Netzwerkanfragen, kein Hochladen. Alles geschieht in diesem Browser.','Omega es una única página autónoma. No usa código, fuentes, mapas ni servicios de terceros, no hace peticiones de red y nunca sube archivos. Todo ocurre en este navegador.'],

'ab.supporttxt':['Read the manual (FAQ and troubleshooting sections). For a technical problem, copy the diagnostic information below — it contains no file content — and attach it to your request.','Leia o manual (seções de perguntas e solução de problemas). Para um problema técnico, copie as informações de diagnóstico abaixo — sem conteúdo de arquivos — e anexe ao seu pedido.','Consultez le manuel (FAQ et dépannage). Pour un problème technique, copiez les informations de diagnostic ci-dessous — sans contenu de fichier — et joignez-les à votre demande.','Leggi il manuale (FAQ e risoluzione problemi). Per un problema tecnico copia le informazioni diagnostiche qui sotto — senza contenuto dei file — e allegale alla richiesta.','Przeczytaj podręcznik (FAQ i rozwiązywanie problemów). W razie problemu technicznego skopiuj poniższe dane diagnostyczne — bez treści plików — i dołącz do zgłoszenia.','Lesen Sie das Handbuch (FAQ und Fehlerbehebung). Bei technischen Problemen die Diagnosedaten unten kopieren — ohne Dateiinhalte — und der Anfrage beifügen.','Lea el manual (preguntas frecuentes y solución de problemas). Ante un problema técnico, copie la información de diagnóstico — sin contenido de archivos — y adjúntela a su solicitud.'],

'il.histstat':['Gaps (empty levels between filled ones): {g} · clipped shadows {a}% · clipped highlights {b}% · used range {r}','Lacunas (níveis vazios entre preenchidos): {g} · sombras cortadas {a}% · altas luzes cortadas {b}% · faixa usada {r}','Trous (niveaux vides entre niveaux pleins) : {g} · ombres écrêtées {a} % · hautes lumières écrêtées {b} % · plage {r}','Lacune (livelli vuoti tra pieni): {g} · ombre tagliate {a}% · alte luci tagliate {b}% · gamma {r}','Luki (puste poziomy między wypełnionymi): {g} · obcięte cienie {a}% · obcięte światła {b}% · zakres {r}','Lücken (leere Stufen zwischen belegten): {g} · abgeschnittene Tiefen {a} % · Lichter {b} % · Bereich {r}','Huecos (niveles vacíos entre llenos): {g} · sombras recortadas {a}% · luces recortadas {b}% · rango {r}'],

'il.h.orig':['The image as decoded by the browser.','A imagem como decodificada pelo navegador.','L’image telle que décodée par le navigateur.','L’immagine come decodificata dal browser.','Obraz zdekodowany przez przeglądarkę.','Das Bild, wie der Browser es dekodiert.','La imagen tal como la decodifica el navegador.'],
'il.h.ela':['ELA re-saves the image as JPEG and shows the difference. Areas edited after the last save often compress differently and appear brighter or with another texture. Uniform edges and fine detail naturally look brighter.','A ELA salva a imagem de novo como JPEG e mostra a diferença. Áreas editadas depois do último salvamento costumam comprimir de forma diferente e surgem mais claras ou com outra textura. Bordas e detalhes finos naturalmente parecem mais claros.','L’ELA réenregistre l’image en JPEG et montre l’écart. Les zones éditées après le dernier enregistrement se compressent souvent différemment et ressortent. Contours et détails fins ressortent naturellement.','L’ELA salva di nuovo l’immagine in JPEG e mostra la differenza. Le aree modificate dopo l’ultimo salvataggio si comprimono spesso in modo diverso e risaltano. Bordi e dettagli fini risaltano naturalmente.','ELA ponownie zapisuje obraz jako JPEG i pokazuje różnicę. Obszary edytowane po ostatnim zapisie często kompresują się inaczej i są jaśniejsze. Krawędzie i drobne detale naturalnie są jaśniejsze.','ELA speichert das Bild erneut als JPEG und zeigt die Differenz. Nach dem letzten Speichern bearbeitete Bereiche komprimieren oft anders und treten hervor. Kanten und feine Details sind natürlich heller.','El ELA vuelve a guardar la imagen como JPEG y muestra la diferencia. Las zonas editadas tras el último guardado suelen comprimirse distinto y destacan. Bordes y detalles finos destacan de forma natural.'],
'il.h.noise':['Shows the sensor noise. Pasted or retouched regions often have smoother or different noise from the rest of the photo.','Mostra o ruído do sensor. Regiões coladas ou retocadas costumam ter ruído mais liso ou diferente do resto da foto.','Montre le bruit du capteur. Les zones collées ou retouchées ont souvent un bruit plus lisse ou différent.','Mostra il rumore del sensore. Le zone incollate o ritoccate hanno spesso un rumore diverso.','Pokazuje szum matrycy. Wklejone lub retuszowane obszary często mają gładszy lub inny szum.','Zeigt das Sensorrauschen. Eingefügte oder retuschierte Bereiche haben oft glatteres oder anderes Rauschen.','Muestra el ruido del sensor. Las zonas pegadas o retocadas suelen tener un ruido distinto.'],
'il.h.edges':['Edge strength. Unnaturally sharp or soft outlines around an object may indicate compositing.','Intensidade das bordas. Contornos anormalmente nítidos ou suaves ao redor de um objeto podem indicar montagem.','Intensité des contours. Des contours anormalement nets ou flous autour d’un objet peuvent indiquer un montage.','Intensità dei bordi. Contorni innaturalmente netti o morbidi possono indicare un fotomontaggio.','Siła krawędzi. Nienaturalnie ostre lub miękkie kontury obiektu mogą wskazywać na fotomontaż.','Kantenstärke. Unnatürlich scharfe oder weiche Umrisse können auf eine Montage hindeuten.','Intensidad de bordes. Contornos anormalmente nítidos o suaves pueden indicar un montaje.'],
'il.h.hist':['Distribution of tones. A comb-like histogram with regular gaps suggests levels/contrast adjustment after capture.','Distribuição de tons. Um histograma em forma de pente com lacunas regulares sugere ajuste de níveis/contraste após a captura.','Répartition des tons. Un histogramme en peigne à trous réguliers suggère un réglage des niveaux après la prise.','Distribuzione dei toni. Un istogramma a pettine con lacune regolari suggerisce una regolazione dei livelli.','Rozkład tonów. Histogram w kształcie grzebienia z regularnymi lukami sugeruje korektę poziomów po wykonaniu zdjęcia.','Tonwertverteilung. Ein kammartiges Histogramm mit regelmäßigen Lücken deutet auf Tonwertkorrektur hin.','Distribución de tonos. Un histograma en peine con huecos regulares sugiere un ajuste de niveles tras la captura.'],
'il.h.clone':['Searches for identical textured blocks at different places (copy-move). Repetitive patterns (bricks, tiles, sky) can produce false matches.','Procura blocos com textura idêntica em lugares diferentes (copiar-mover). Padrões repetitivos (tijolos, azulejos, céu) podem gerar falsos positivos.','Recherche des blocs texturés identiques à différents endroits (copier-déplacer). Les motifs répétitifs peuvent produire de faux positifs.','Cerca blocchi con texture identica in punti diversi (copia-sposta). Motivi ripetitivi possono dare falsi positivi.','Szuka identycznych bloków w różnych miejscach (kopiuj-przesuń). Powtarzalne wzory mogą dawać fałszywe trafienia.','Sucht identische Texturblöcke an verschiedenen Stellen (Copy-Move). Wiederholte Muster können Fehltreffer erzeugen.','Busca bloques con textura idéntica en lugares distintos (copiar-mover). Los patrones repetitivos pueden dar falsos positivos.'],
'il.h.thumb':['Cameras store a small preview when the photo is taken. If the photo is later edited and the preview is not updated, the two differ.','As câmeras gravam uma pequena prévia ao tirar a foto. Se a foto for editada depois e a prévia não for atualizada, as duas diferem.','Les appareils enregistrent un petit aperçu à la prise de vue. Si la photo est éditée ensuite sans mettre à jour l’aperçu, les deux diffèrent.','Le fotocamere salvano una piccola anteprima allo scatto. Se la foto viene modificata senza aggiornare l’anteprima, le due differiscono.','Aparaty zapisują mały podgląd podczas robienia zdjęcia. Jeśli zdjęcie edytowano bez aktualizacji podglądu, oba się różnią.','Kameras speichern beim Auslösen eine kleine Vorschau. Wird das Foto später ohne Aktualisierung der Vorschau bearbeitet, weichen beide ab.','Las cámaras guardan una pequeña vista previa al disparar. Si la foto se edita después sin actualizarla, ambas difieren.'],

'al.help':['Red lines: abrupt discontinuities (possible cuts or insertions). Magenta: runs of digital silence (exact zeros), typical of edited joins. Blue bands: silence below −60 dBFS. A sudden change of background noise or of the spectrum at one instant also suggests a splice. Tap to listen from that point.','Linhas vermelhas: descontinuidades abruptas (possíveis cortes ou inserções). Magenta: silêncio digital (zeros exatos), típico de emendas editadas. Faixas azuis: silêncio abaixo de −60 dBFS. Mudança repentina do ruído de fundo ou do espectro num instante também sugere emenda. Toque para ouvir a partir dali.','Lignes rouges : discontinuités brusques (coupes ou insertions possibles). Magenta : silence numérique (zéros exacts), typique des raccords. Bandes bleues : silence sous −60 dBFS. Un changement soudain du bruit de fond ou du spectre suggère aussi un raccord. Touchez pour écouter à partir de là.','Linee rosse: discontinuità brusche (possibili tagli o inserimenti). Magenta: silenzio digitale (zeri esatti), tipico delle giunzioni. Bande blu: silenzio sotto −60 dBFS. Un cambio improvviso del rumore di fondo o dello spettro suggerisce una giunzione. Tocca per ascoltare da lì.','Czerwone linie: nagłe nieciągłości (możliwe cięcia lub wstawki). Magenta: cyfrowa cisza (dokładne zera), typowa dla sklejeń. Niebieskie pasy: cisza poniżej −60 dBFS. Nagła zmiana szumu tła lub widma także sugeruje sklejenie. Dotknij, aby odsłuchać od tego miejsca.','Rote Linien: abrupte Sprünge (mögliche Schnitte oder Einfügungen). Magenta: digitale Stille (exakte Nullen), typisch für Schnittstellen. Blaue Bänder: Stille unter −60 dBFS. Ein plötzlicher Wechsel des Grundrauschens oder Spektrums deutet ebenfalls auf einen Schnitt. Antippen zum Abhören.','Líneas rojas: discontinuidades bruscas (posibles cortes o inserciones). Magenta: silencio digital (ceros exactos), típico de empalmes. Bandas azules: silencio bajo −60 dBFS. Un cambio repentino del ruido de fondo o del espectro también sug 'f.ext_mismatch':['Extension {ext} does not match the real content ({fmt})','A extensão {ext} não corresponde ao conteúdo real ({fmt})','L’extension {ext} ne correspond pas au contenu réel ({fmt})','L’estensione {ext} non corrisponde al contenuto reale ({fmt})','Rozszerzenie {ext} nie odpowiada rzeczywistej zawartości ({fmt})','Endung {ext} passt nicht zum tatsächlichen Inhalt ({fmt})','La extensión {ext} no coincide con el contenido real ({fmt})'],
'fd.ext_mismatch':['The file was renamed or disguised. The internal signature identifies the true format; files are sometimes renamed to hide their nature.','O arquivo foi renomeado ou disfarçado. A assinatura interna identifica o formato verdadeiro; arquivos às vezes são renomeados para ocultar sua natureza.','Le fichier a été renommé ou maquillé. La signature interne révèle le vrai format ; on renomme parfois des fichiers pour en cacher la nature.','Il file è stato rinominato o camuffato. La firma interna indica il vero formato; a volte i file vengono rinominati per nasconderne la natura.','Plik zmieniono lub zamaskowano. Wewnętrzna sygnatura wskazuje prawdziwy format; nazwy zmienia się czasem, by ukryć charakter pliku.','Die Datei wurde umbenannt oder getarnt. Die interne Signatur zeigt das wahre Format; Umbenennen dient manchmal dem Verbergen.','El archivo fue renombrado o disfrazado. La firma interna identifica el formato real; a veces se renombran archivos para ocultar su naturaleza.'],
'f.mod_before_create':['Modification ({b}) earlier than creation ({a}) — {src}','Modificação ({b}) anterior à criação ({a}) — {src}','Modification ({b}) antérieure à la création ({a}) — {src}','Modifica ({b}) precedente alla creazione ({a}) — {src}','Modyfikacja ({b}) wcześniejsza niż utworzenie ({a}) — {src}','Änderung ({b}) vor Erstellung ({a}) — {src}','Modificación ({b}) anterior a la creación ({a}) — {src}'],
'fd.mod_before_create':['A file cannot be modified before it exists. This points to a wrong device clock, manual editing of dates or reconstruction of the file.','Um arquivo não pode ser modificado antes de existir. Indica relógio errado do dispositivo, edição manual de datas ou reconstrução do arquivo.','Un fichier ne peut être modifié avant d’exister : horloge erronée, dates modifiées à la main ou fichier reconstruit.','Un file non può essere modificato prima di esistere: orologio errato, date modificate a mano o file ricostruito.','Pliku nie można zmienić, zanim powstał: błędny zegar, ręczna edycja dat lub rekonstrukcja pliku.','Eine Datei kann nicht vor ihrer Entstehung geändert werden: falsche Uhr, manuell geänderte Daten oder rekonstruierte Datei.','Un archivo no puede modificarse antes de existir: reloj erróneo, fechas editadas a mano o archivo reconstruido.'],
'f.thumb_diff':['Embedded thumbnail differs from the main image ({pct})','A miniatura embutida difere da imagem principal ({pct})','La miniature diffère de l’image principale ({pct})','La miniatura differisce dall’immagine principale ({pct})','Osadzona miniatura różni się od obrazu głównego ({pct})','Eingebettete Vorschau weicht vom Hauptbild ab ({pct})','La miniatura difiere de la imagen principal ({pct})'],
'fd.thumb_diff':['The preview stored by the camera no longer matches the picture. The image was probably cropped, retouched or replaced after capture without updating the thumbnail.','A prévia gravada pela câmera não corresponde mais à imagem. Provavelmente a imagem foi cortada, retocada ou substituída após a captura sem atualizar a miniatura.','L’aperçu de l’appareil ne correspond plus à l’image : recadrage, retouche ou remplacement probable après la prise.','L’anteprima della fotocamera non corrisponde più all’immagine: probabile ritaglio, ritocco o sostituzione dopo lo scatto.','Podgląd zapisany przez aparat nie odpowiada obrazowi: prawdopodobnie przycięto, retuszowano lub podmieniono zdjęcie.','Die Kameravorschau passt nicht mehr zum Bild: wahrscheinlich nach der Aufnahme beschnitten, retuschiert oder ersetzt.','La vista previa de la cámara ya no coincide con la imagen: probablemente recortada, retocada o sustituida tras la captura.'],
'f.pdf_sig_after':['Content added after the digital signature ({bytes})','Conteúdo adicionado após a assinatura digital ({bytes})','Contenu ajouté après la signature ({bytes})','Contenuto aggiunto dopo la firma ({bytes})','Treść dodana po podpisie cyfrowym ({bytes})','Inhalt nach der Signatur hinzugefügt ({bytes})','Contenido añadido tras la firma ({bytes})'],
'fd.pdf_sig_after':['The signed byte range does not cover the end of the file: the document was saved again after signing. The signature only guarantees the earlier version.','O intervalo assinado não cobre o fim do arquivo: o documento foi salvo novamente após a assinatura. A assinatura garante apenas a versão anterior.','La plage signée ne couvre pas la fin du fichier : le document a été réenregistré après signature, qui ne garantit que la version antérieure.','L’intervallo firmato non copre la fine del file: il documento è stato salvato dopo la firma, che garantisce solo la versione precedente.','Podpisany zakres nie obejmuje końca pliku: dokument zapisano po podpisaniu. Podpis gwarantuje tylko wcześniejszą wersję.','Der signierte Bereich deckt das Dateiende nicht ab: Das Dokument wurde nach der Signatur erneut gespeichert. Die Signatur gilt nur für die frühere Fassung.','El rango firmado no cubre el final del archivo: el documento se guardó tras firmarse. La firma solo garantiza la versión anterior.'],
'f.pdf_active':['Active content in PDF: {list}','Conteúdo ativo no PDF: {list}','Contenu actif dans le PDF : {list}','Contenuto attivo nel PDF: {list}','Aktywna treść w PDF: {list}','Aktive Inhalte im PDF: {list}','Contenido activo en el PDF: {list}'],
'fd.pdf_active':['Scripts, launch actions or embedded files can run code or hide other documents. Treat the file with care; it may be malicious.','Scripts, ações de execução ou arquivos embutidos podem executar código ou ocultar outros documentos. Manuseie com cuidado; pode ser malicioso.','Scripts, actions de lancement ou fichiers incorporés peuvent exécuter du code ou cacher d’autres documents. Prudence.','Script, azioni di avvio o file incorporati possono eseguire codice o nascondere documenti. Attenzione.','Skrypty, akcje uruchamiania lub osadzone pliki mogą wykonywać kod lub ukrywać dokumenty. Zachowaj ostrożność.','Skripte, Startaktionen oder eingebettete Dateien können Code ausführen oder Dokumente verbergen. Vorsicht.','Scripts, acciones de ejecución o archivos incrustados pueden ejecutar código u ocultar documentos. Precaución.'],
'f.off_macro':['Document contains macros (VBA / Basic)','O documento contém macros (VBA / Basic)','Le document contient des macros (VBA / Basic)','Il documento contiene macro (VBA / Basic)','Dokument zawiera makra (VBA / Basic)','Dokument enthält Makros (VBA / Basic)','El documento contiene macros (VBA / Basic)'],
'fd.off_macro':['Macros are programs inside the document. They can alter content when opened and are a common malware vector.','Macros são programas dentro do documento. Podem alterar o conteúdo ao abrir e são vetor comum de malware.','Les macros sont des programmes dans le document ; elles peuvent modifier le contenu et servent souvent aux logiciels malveillants.','Le macro sono programmi nel documento; possono alterare il contenuto e sono un vettore comune di malware.','Makra to programy w dokumencie; mogą zmieniać treść i są częstym wektorem złośliwego oprogramowania.','Makros sind Programme im Dokument; sie können Inhalte ändern und sind ein häufiger Malware-Weg.','Las macros son programas dentro del documento; pueden alterar el contenido y son un vector común de malware.'],
'f.off_tpl':['Remote template or object loaded from the internet ({n} external links)','Modelo ou objeto remoto carregado da internet ({n} vínculos externos)','Modèle ou objet distant chargé depuis Internet ({n} liens externes)','Modello o oggetto remoto caricato da Internet ({n} link esterni)','Zdalny szablon lub obiekt z internetu ({n} łączy zewnętrznych)','Entfernte Vorlage oder Objekt aus dem Internet ({n} externe Links)','Plantilla u objeto remoto cargado de internet ({n} vínculos externos)'],
'fd.off_tpl':['When opened, the document fetches content from an external address. This technique is used to track readers or deliver malicious code.','Ao abrir, o documento busca conteúdo em endereço externo. Técnica usada para rastrear leitores ou entregar código malicioso.','À l’ouverture, le document récupère du contenu externe — technique de pistage ou de diffusion de code malveillant.','All’apertura il documento recupera contenuti esterni — tecnica di tracciamento o di distribuzione di codice malevolo.','Po otwarciu dokument pobiera treść z zewnątrz — technika śledzenia lub dostarczania złośliwego kodu.','Beim Öffnen lädt das Dokument externe Inhalte — Technik zum Tracking oder zur Verbreitung von Schadcode.','Al abrirse, el documento obtiene contenido externo — técnica de rastreo o de entrega de código malicioso.'],
'f.mail_auth':['E-mail authentication failed: {res}','Falha de autenticação do e-mail: {res}','Échec d’authentification de l’e-mail : {res}','Autenticazione e-mail fallita: {res}','Nieudane uwierzytelnienie e-maila: {res}','E-Mail-Authentifizierung fehlgeschlagen: {res}','Falló la autenticación del correo: {res}'],
'fd.mail_auth':['The receiving server could not confirm that the message came from the sender’s domain (SPF/DKIM/DMARC). Typical of spoofing or messages altered in transit.','O servidor receptor não confirmou que a mensagem veio do domínio do remetente (SPF/DKIM/DMARC). Típico de falsificação ou mensagem alterada em trânsito.','Le serveur n’a pas confirmé que le message venait du domaine de l’expéditeur (SPF/DKIM/DMARC) : usurpation ou altération probable.','Il server non ha confermato che il messaggio provenisse dal dominio del mittente (SPF/DKIM/DMARC): possibile falsificazione o alterazione.','Serwer nie potwierdził, że wiadomość pochodzi z domeny nadawcy (SPF/DKIM/DMARC) — typowe dla podszywania się lub zmian w tranzycie.','Der Server konnte die Herkunft aus der Absenderdomain nicht bestätigen (SPF/DKIM/DMARC) — typisch für Fälschung oder Veränderung.','El servidor no confirmó que el mensaje procediera del dominio del remitente (SPF/DKIM/DMARC): típico de suplantación o alteración.'],
'f.bidi':['Bidirectional override characters in text ({n})','Caracteres de inversão bidirecional no texto ({n})','Caractères de forçage bidirectionnel ({n})','Caratteri di override bidirezionale ({n})','Znaki wymuszania kierunku tekstu ({n})','Bidirektionale Steuerzeichen im Text ({n})','Caracteres de forzado bidireccional ({n})'],
'fd.bidi':['These invisible characters change the display order of text, so what is read differs from what is stored. Used to disguise file names, links or code.','Esses caracteres invisíveis mudam a ordem de exibição do texto: o que se lê difere do que está gravado. Usados para disfarçar nomes, links ou código.','Ces caractères invisibles changent l’ordre d’affichage : ce qu’on lit diffère du contenu réel. Servent à maquiller noms, liens ou code.','Questi caratteri invisibili cambiano l’ordine di visualizzazione: ciò che si legge differisce dal contenuto. Usati per camuffare nomi, link o codice.','Niewidoczne znaki zmieniają kolejność wyświetlania — czytany tekst różni się od zapisanego. Służą do maskowania nazw, linków lub kodu.','Diese unsichtbaren Zeichen ändern die Anzeigereihenfolge — Gelesenes weicht vom Gespeicherten ab. Dient zum Tarnen von Namen, Links oder Code.','Estos caracteres invisibles cambian el orden de visualización: lo que se lee difiere de lo guardado. Se usan para disfrazar nombres, enlaces o código.'],
'f.ai_gen':['Signs of AI generation or synthetic media ({hint})','Sinais de geração por IA ou mídia sintética ({hint})','Signes de génération par IA ({hint})','Segni di generazione IA ({hint})','Oznaki generowania przez AI ({hint})','Hinweise auf KI-Erzeugung ({hint})','Indicios de generación por IA ({hint})'],
'fd.ai_gen':['The metadata names a generative-AI tool or declares the content as synthetic. The image or media was likely produced or altered by AI.','Os metadados citam uma ferramenta de IA generativa ou declaram o conteúdo como sintético. A mídia provavelmente foi produzida ou alterada por IA.','Les métadonnées citent un outil d’IA générative ou déclarent le contenu synthétique : média probablement produit ou modifié par IA.','I metadati citano uno strumento di IA generativa o dichiarano il contenuto sintetico: probabilmente prodotto o alterato da IA.','Metadane wskazują narzędzie generatywnej AI lub deklarują treść jako syntetyczną — prawdopodobnie utworzone lub zmienione przez AI.','Metadaten nennen ein generatives KI-Werkzeug oder deklarieren den Inhalt als synthetisch — wahrscheinlich KI-erzeugt oder -verändert.','Los metadatos citan una herramienta de IA generativa o declaran el contenido sintético: probablemente producido o alterado por IA.'],
'f.trailing':['Extra data after the end of the file ({bytes}, {info})','Dados extras após o fim do arquivo ({bytes}, {info})','Données après la fin du fichier ({bytes}, {info})','Dati extra dopo la fine del file ({bytes}, {info})','Dodatkowe dane za końcem pliku ({bytes}, {info})','Zusätzliche Daten nach Dateiende ({bytes}, {info})','Datos extra tras el final del archivo ({bytes}, {info})'],
'fd.trailing':['Bytes were appended after the logical end. It can be legitimate (motion photos, vendor trailers) or an appended/hidden file. Check the Hex tool’s embedded signatures.','Bytes foram acrescentados após o fim lógico. Pode ser legítimo (fotos com movimento, dados do fabricante) ou arquivo anexado/oculto. Veja as assinaturas embutidas na ferramenta Hex.','Des octets suivent la fin logique : légitime (photos animées, données constructeur) ou fichier ajouté/caché. Voir les signatures dans l’outil Hex.','Byte aggiunti dopo la fine logica: legittimi (foto in movimento, dati del produttore) o file aggiunto/nascosto. Vedi le firme nello strumento Hex.','Za logicznym końcem dopisano bajty: może to być prawidłowe (zdjęcia ruchome, dane producenta) lub ukryty plik. Sprawdź sygnatury w narzędziu Hex.','Nach dem logischen Ende wurden Bytes angehängt: legitim (Bewegungsfotos, Herstellerdaten) oder versteckte Datei. Siehe Signaturen im Hex-Werkzeug.','Se añadieron bytes tras el final lógico: legítimo (fotos con movimiento, datos del fabricante) o archivo oculto. Vea las firmas en la herramienta Hex.'],
'f.edit_sw':['Processed with editing software: {sw}','Processado em software de edição: {sw}','Traité avec un logiciel d’édition : {sw}','Elaborato con software di editing: {sw}','Przetworzono w programie do edycji: {sw}','Mit Bearbeitungssoftware verarbeitet: {sw}','Procesado con software de edición: {sw}'],
'fd.edit_sw':['The file records that it was opened and saved by an editing tool. This does not prove the content was altered, but the file is not a camera/recorder original.','O arquivo registra que foi aberto e salvo por ferramenta de edição. Isso não prova alteração do conteúdo, mas o arquivo não é o original da câmera/gravador.','Le fichier indique un enregistrement par un outil d’édition. Cela ne prouve pas une altération, mais ce n’est pas l’original de l’appareil.','Il file registra un salvataggio con uno strumento di editing. Non prova un’alterazione, ma non è l’originale del dispositivo.','Plik zapisano narzędziem do edycji. Nie dowodzi to zmiany treści, ale nie jest to oryginał z urządzenia.','Die Datei wurde mit einem Bearbeitungswerkzeug gespeichert. Das beweist keine Veränderung, aber es ist kein Geräte-Original.','El archivo registra que se guardó con una herramienta de edición. No prueba alteración, pero no es el original del dispositivo.'],
'f.exif_mod_diff':['Modification date ({b}) differs from capture date ({a})','Data de modificação ({b}) difere da captura ({a})','Date de modification ({b}) différente de la prise de vue ({a})','Data di modifica ({b}) diversa dallo scatto ({a})','Data modyfikacji ({b}) różni się od daty wykonania ({a})','Änderungsdatum ({b}) weicht vom Aufnahmedatum ({a}) ab','Fecha de modificación ({b}) distinta de la captura ({a})'],
'fd.exif_mod_diff':['Cameras normally write both dates at the same moment. A later modification date means the photo was saved again by some software after it was taken.','Câmeras normalmente gravam as duas datas no mesmo instante. Uma data de modificação posterior indica que a foto foi salva de novo por algum software.','Les appareils écrivent normalement les deux dates au même instant ; une date ultérieure indique un réenregistrement logiciel.','Le fotocamere scrivono normalmente le due date nello stesso istante; una data successiva indica un nuovo salvataggio.','Aparaty zwykle zapisują obie daty jednocześnie; późniejsza data modyfikacji oznacza ponowny zapis przez oprogramowanie.','Kameras schreiben beide Daten normalerweise gleichzeitig; ein späteres Änderungsdatum zeigt erneutes Speichern durch Software.','Las cámaras escriben normalmente ambas fechas a la vez; una posterior indica que el archivo se volvió a guardar con algún programa.'],
'f.future':['Date in the future: {date}','Data no futuro: {date}','Date dans le futur : {date}','Data nel futuro: {date}','Data w przyszłości: {date}','Datum in der Zukunft: {date}','Fecha en el futuro: {date}'],
'fd.future':['An internal date lies after today. The device clock was wrong or the date was set manually.','Uma data interna é posterior a hoje. O relógio do dispositivo estava errado ou a data foi definida manualmente.','Une date interne est postérieure à aujourd’hui : horloge fausse ou date saisie manuellement.','Una data interna è successiva a oggi: orologio errato o data impostata manualmente.','Data wewnętrzna jest późniejsza niż dziś: błędny zegar lub ręcznie ustawiona data.','Ein internes Datum liegt nach heute: falsche Uhr oder manuell gesetzt.','Una fecha interna es posterior a hoy: reloj erróneo o fecha fijada a mano.'],
'f.xmp_hist':['Edit history recorded ({n} actions)','Histórico de edição registrado ({n} ações)','Historique d’édition enregistré ({n} actions)','Cronologia di modifica registrata ({n} azioni)','Zapisana historia edycji ({n} czynności)','Bearbeitungsverlauf gespeichert ({n} Aktionen)','Historial de edición registrado ({n} acciones)'],
'fd.xmp_hist':['Adobe-type software logged each save, conversion or derivation, with time and tool. See the Metadata tab and the Timeline for every step.','Software do tipo Adobe registrou cada salvamento, conversão ou derivação, com hora e ferramenta. Veja a aba Metadados e a Linha do tempo.','Un logiciel de type Adobe a consigné chaque enregistrement ou conversion avec l’heure et l’outil. Voir Métadonnées et Chronologie.','Un software tipo Adobe ha registrato ogni salvataggio o conversione con ora e strumento. Vedi Metadati e Cronologia.','Oprogramowanie typu Adobe zapisało każdy zapis lub konwersję z czasem i narzędziem. Zob. Metadane i Oś czasu.','Software wie Adobe protokollierte jedes Speichern oder Konvertieren mit Zeit und Werkzeug. Siehe Metadaten und Zeitachse.','Un software tipo Adobe registró cada guardado o conversión con hora y herramienta. Vea Metadatos y Línea de tiempo.'],
'f.dims_diff':['Recorded dimensions ({a}) differ from actual ({b})','Dimensões registradas ({a}) diferem das reais ({b})','Dimensions enregistrées ({a}) différentes des réelles ({b})','Dimensioni registrate ({a}) diverse da quelle reali ({b})','Zapisane wymiary ({a}) różnią się od rzeczywistych ({b})','Gespeicherte Abmessungen ({a}) weichen von den echten ({b}) ab','Dimensiones registradas ({a}) distintas de las reales ({b})'],
'fd.dims_diff':['The image was resized or cropped after the metadata was written.','A imagem foi redimensionada ou cortada depois que os metadados foram gravados.','L’image a été redimensionnée ou recadrée après l’écriture des métadonnées.','L’immagine è stata ridimensionata o ritagliata dopo la scrittura dei metadati.','Obraz przeskalowano lub przycięto po zapisaniu metadanych.','Das Bild wurde nach dem Schreiben der Metadaten skaliert oder beschnitten.','La imagen se redimensionó o recortó después de escribir los metadatos.'],
'f.pdf_incr':['PDF saved {n} more time(s) after creation (incremental updates)','PDF salvo mais {n} vez(es) após a criação (atualizações incrementais)','PDF réenregistré {n} fois après création (mises à jour incrémentielles)','PDF salvato altre {n} volte (aggiornamenti incrementali)','PDF zapisany jeszcze {n} raz(y) (aktualizacje przyrostowe)','PDF nach Erstellung {n}-mal erneut gespeichert (inkrementell)','PDF guardado {n} vez(es) más (actualizaciones incrementales)'],
'fd.pdf_incr':['Each incremental save appends changes to the end of the file while keeping the earlier version inside it. Form filling, signing and annotating also cause this.','Cada salvamento incremental acrescenta alterações ao fim do arquivo mantendo a versão anterior dentro dele. Preencher formulários, assinar e anotar também causam isso.','Chaque enregistrement incrémentiel ajoute les modifications à la fin en conservant la version précédente. Formulaires, signatures et annotations en produisent aussi.','Ogni salvataggio incrementale aggiunge modifiche in coda mantenendo la versione precedente. Moduli, firme e annotazioni lo causano.','Każdy zapis przyrostowy dopisuje zmiany na końcu, zachowując poprzednią wersję. Powodują to też formularze, podpisy i adnotacje.','Jedes inkrementelle Speichern hängt Änderungen an und behält die frühere Fassung. Auch Formulare, Signaturen und Kommentare bewirken das.','Cada guardado incremental añade cambios al final conservando la versión anterior. También lo causan formularios, firmas y anotaciones.'],
'f.pdf_dates_diff':['Info and XMP modification dates disagree ({a} / {b})','Datas de modificação Info e XMP divergem ({a} / {b})','Dates de modification Info et XMP divergentes ({a} / {b})','Date di modifica Info e XMP discordanti ({a} / {b})','Daty modyfikacji Info i XMP są niezgodne ({a} / {b})','Info- und XMP-Änderungsdatum weichen ab ({a} / {b})','Fechas de modificación Info y XMP no coinciden ({a} / {b})'],
'fd.pdf_dates_diff':['Well-behaved software updates both records together. A mismatch suggests a tool that edited only one of them.','Softwares corretos atualizam os dois registros juntos. A divergência sugere ferramenta que editou só um deles.','Un logiciel correct met à jour les deux ; l’écart suggère un outil n’en ayant modifié qu’un.','Un software corretto aggiorna entrambi; la discrepanza suggerisce uno strumento che ne ha modificato solo uno.','Poprawne oprogramowanie aktualizuje oba zapisy; rozbieżność sugeruje narzędzie, które zmieniło tylko jeden.','Ordentliche Software aktualisiert beide; eine Abweichung deutet auf ein Werkzeug, das nur einen änderte.','Un software correcto actualiza ambos; la discrepancia sugiere una herramienta que editó solo uno.'],
'f.off_extlink':['{n} external link(s) in the document','{n} vínculo(s) externo(s) no documento','{n} lien(s) externe(s) dans le document','{n} collegamento/i esterno/i','{n} łącze(a) zewnętrzne','{n} externe Verknüpfung(en)','{n} vínculo(s) externo(s)'],
'fd.off_extlink':['The document references resources outside itself (web addresses, network files). Content may change depending on where it is opened.','O documento referencia recursos externos (endereços web, arquivos de rede). O conteúdo pode mudar conforme onde for aberto.','Le document référence des ressources externes ; son contenu peut varier selon l’endroit où il est ouvert.','Il documento fa riferimento a risorse esterne; il contenuto può cambiare a seconda di dove viene aperto.','Dokument odwołuje się do zasobów zewnętrznych; treść może zależeć od miejsca otwarcia.','Das Dokument verweist auf externe Ressourcen; der Inhalt kann je nach Ort variieren.','El documento referencia recursos externos; el contenido puede variar según dónde se abra.'],
'f.media_elst':['Edit list with {n} segments in track {track}','Lista de edição com {n} segmentos na faixa {track}','Liste d’édition de {n} segments (piste {track})','Lista di montaggio con {n} segmenti (traccia {track})','Lista edycji z {n} segmentami (ścieżka {track})','Schnittliste mit {n} Segmenten (Spur {track})','Lista de edición con {n} segmentos (pista {track})'],
'fd.media_elst':['The container tells the player to skip or rearrange parts of the stream — a sign of trimming or editing without re-encoding.','O contêiner instrui o player a pular ou reordenar partes do fluxo — sinal de corte ou edição sem recodificação.','Le conteneur demande de sauter ou réordonner des parties : coupe ou montage sans réencodage.','Il contenitore indica di saltare o riordinare parti del flusso: taglio o montaggio senza ricodifica.','Kontener każe pomijać lub przestawiać fragmenty — oznaka przycinania lub montażu bez ponownego kodowania.','Der Container lässt Teile überspringen oder umordnen — Zeichen für Schnitt ohne Neukodierung.','El contenedor indica saltar o reordenar partes: recorte o edición sin recodificar.'],
'f.audio_disc':['Abrupt discontinuities in the audio','Descontinuidades abruptas no áudio','Discontinuités brusques dans l’audio','Discontinuità brusche nell’audio','Nagłe nieciągłości w audio','Abrupte Sprünge im Audio','Discontinuidades bruscas en el audio'],
'fd.audio_disc':['Sudden jumps in the waveform may be edit points where parts were removed or inserted.','Saltos repentinos na forma de onda podem ser pontos de edição onde trechos foram removidos ou inseridos.','Des sauts soudains peuvent marquer des points de montage.','Salti improvvisi possono indicare punti di montaggio.','Nagłe skoki mogą być miejscami montażu.','Plötzliche Sprünge können Schnittstellen sein.','Saltos repentinos pueden ser puntos de edición.'],
'f.hidden_chars':['Invisible zero-width characters ({n})','Caracteres invisíveis de largura zero ({n})','Caractères invisibles de largeur nulle ({n})','Caratteri invisibili a larghezza zero ({n})','Niewidoczne znaki zerowej szerokości ({n})','Unsichtbare Nullbreitenzeichen ({n})','Caracteres invisibles de ancho cero ({n})'],
'fd.hidden_chars':['Characters that occupy no space can carry hidden marks (watermarking leaks), break searches or hide text.','Caracteres que não ocupam espaço podem carregar marcas ocultas (rastrear vazamentos), atrapalhar buscas ou esconder texto.','Ces caractères sans largeur peuvent porter des marques cachées, gêner les recherches ou dissimuler du texte.','Caratteri senza larghezza possono contenere marcature nascoste, ostacolare ricerche o celare testo.','Znaki bez szerokości mogą zawierać ukryte znaczniki, utrudniać wyszukiwanie lub ukrywać tekst.','Zeichen ohne Breite können versteckte Markierungen tragen, Suchen stören oder Text verbergen.','Caracteres sin ancho pueden llevar marcas ocultas, dificultar búsquedas u ocultar texto.'],
'f.homoglyph':['Words mixing Latin with Cyrillic/Greek letters ({n}: {ex})','Palavras misturando letras latinas com cirílicas/gregas ({n}: {ex})','Mots mêlant latin et cyrillique/grec ({n} : {ex})','Parole che mescolano latino e cirillico/greco ({n}: {ex})','Słowa łączące litery łacińskie z cyrylicą/greką ({n}: {ex})','Wörter mit gemischten lateinischen und kyrillischen/griechischen Buchstaben ({n}: {ex})','Palabras que mezclan latín con cirílico/griego ({n}: {ex})'],
'fd.homoglyph':['Look-alike letters from other alphabets are used to fake names, addresses and links while looking identical.','Letras parecidas de outros alfabetos são usadas para falsificar nomes, endereços e links mantendo aparência idêntica.','Des lettres semblables d’autres alphabets servent à falsifier noms, adresses et liens.','Lettere simili di altri alfabeti servono a falsificare nomi, indirizzi e link.','Podobne litery z innych alfabetów służą do fałszowania nazw, adresów i linków.','Ähnliche Buchstaben anderer Alphabete werden zum Fälschen von Namen, Adressen und Links genutzt.','Letras parecidas de otros alfabetos se usan para falsificar nombres, direcciones y enlaces.'],
'f.mail_reply':['Reply-To domain ({b}) differs from sender ({a})','Domínio do Responder-para ({b}) difere do remetente ({a})','Domaine Répondre-à ({b}) différent de l’expéditeur ({a})','Dominio Rispondi-a ({b}) diverso dal mittente ({a})','Domena Reply-To ({b}) inna niż nadawcy ({a})','Reply-To-Domain ({b}) weicht vom Absender ({a}) ab','Dominio Reply-To ({b}) distinto del remitente ({a})'],
'fd.mail_reply':['Answers go to a different organisation than the apparent sender — a classic phishing and fraud pattern.','As respostas vão para organização diferente do remetente aparente — padrão clássico de phishing e fraude.','Les réponses partent vers une autre organisation que l’expéditeur apparent — schéma classique d’hameçonnage.','Le risposte vanno a un’organizzazione diversa dal mittente apparente — schema tipico di phishing.','Odpowiedzi trafiają do innej organizacji niż pozorny nadawca — klasyczny schemat phishingu.','Antworten gehen an eine andere Organisation als den scheinbaren Absender — typisches Phishing-Muster.','Las respuestas van a otra organización distinta del remitente aparente — patrón clásico de phishing.'],
'f.mail_hops':['Inconsistent times along the relay path ({n})','Horários inconsistentes na rota de transmissão ({n})','Heures incohérentes sur le chemin de relais ({n})','Orari incoerenti nel percorso di inoltro ({n})','Niespójne czasy na trasie przekazywania ({n})','Unstimmige Zeiten auf dem Zustellweg ({n})','Horas incoherentes en la ruta de transmisión ({n})'],
'fd.mail_hops':['Servers should timestamp the message in increasing order. Going back in time or a large gap from the Date header suggests forged headers or wrong clocks.','Servidores deveriam registrar horários crescentes. Voltar no tempo ou grande diferença do cabeçalho Date sugere cabeçalhos forjados ou relógios errados.','Les serveurs horodatent en ordre croissant ; un retour en arrière ou un grand écart avec Date suggère des en-têtes falsifiés.','I server dovrebbero marcare orari crescenti; ritorni indietro o grandi scarti suggeriscono intestazioni falsificate.','Serwery powinny stemplować w kolejności rosnącej; cofanie się czasu lub duża różnica sugeruje sfałszowane nagłówki.','Server sollten aufsteigend stempeln; Rücksprünge oder große Abweichungen deuten auf gefälschte Header.','Los servidores deberían sellar en orden creciente; retrocesos o grandes diferencias sugieren cabeceras falsificadas.'],
'f.crc_err':['{n} PNG block(s) with checksum error','{n} bloco(s) PNG com erro de verificação','{n} bloc(s) PNG avec erreur de contrôle','{n} blocco/i PNG con errore di checksum','{n} blok(ów) PNG z błędem sumy kontrolnej','{n} PNG-Block/Blöcke mit Prüfsummenfehler','{n} bloque(s) PNG con error de suma'],
'fd.crc_err':['The block content no longer matches its checksum: the file was damaged or modified by hand at byte level.','O conteúdo do bloco não confere com sua soma de verificação: o arquivo foi danificado ou modificado manualmente em nível de bytes.','Le contenu ne correspond plus à sa somme de contrôle : fichier endommagé ou modifié à la main.','Il contenuto non corrisponde più al checksum: file danneggiato o modificato a mano.','Zawartość nie zgadza się z sumą kontrolną: plik uszkodzono lub zmieniono ręcznie.','Der Inhalt passt nicht mehr zur Prüfsumme: Datei beschädigt oder manuell verändert.','El contenido ya no coincide con su suma: archivo dañado o modificado a mano.'],
'f.clone':['Repeated regions (copy-move)','Regiões repetidas (copiar-mover)','Régions répétées (copier-déplacer)','Regioni ripetute (copia-sposta)','Powtórzone obszary (kopiuj-przesuń)','Wiederholte Bereiche (Copy-Move)','Regiones repetidas (copiar-mover)'],
'fd.clone':['Identical areas in different places can mean an object was hidden or duplicated.','Áreas idênticas em lugares diferentes podem indicar que um objeto foi ocultado ou duplicado.','Des zones identiques à des endroits différents peuvent indiquer un objet masqué ou dupliqué.','Aree identiche in punti diversi possono indicare un oggetto nascosto o duplicato.','Identyczne obszary w różnych miejscach mogą oznaczać ukrycie lub powielenie obiektu.','Identische Bereiche an verschiedenen Stellen können ein verdecktes oder dupliziertes Objekt bedeuten.','Zonas idénticas en lugares distintos pueden indicar un objeto ocultado o duplicado.'],
'f.frozen':['Frozen or duplicated video segments','Trechos de vídeo congelados ou duplicados','Segments vidéo figés ou dupliqués','Segmenti video fermi o duplicati','Zamrożone lub zduplikowane odcinki wideo','Eingefrorene oder duplizierte Videoabschnitte','Tramos de vídeo congelados o duplicados'],
'fd.frozen':['Segments with no change at all may be looped footage used to cover a gap.','Trechos sem nenhuma mudança podem ser imagens repetidas para cobrir uma lacuna.','Des segments sans changement peuvent être une boucle masquant une lacune.','Segmenti senza cambiamenti possono essere un loop che copre una lacuna.','Odcinki bez zmian mogą być zapętleniem ukrywającym lukę.','Abschnitte ohne Änderung können eine Schleife zum Überdecken einer Lücke sein.','Tramos sin cambios pueden ser un bucle que tapa un hueco.'],
'f.fs_before':['File-system date ({a}) earlier than internal creation ({b})','Data do sistema de arquivos ({a}) anterior à criação interna ({b})','Date système ({a}) antérieure à la création interne ({b})','Data del file system ({a}) precedente alla creazione interna ({b})','Data systemu plików ({a}) wcześniejsza niż utworzenie ({b})','Dateisystemdatum ({a}) vor interner Erstellung ({b})','Fecha del sistema ({a}) anterior a la creación interna ({b})'],
'fd.fs_before':['The copy on disk claims to be older than the content itself. Clocks or dates were altered, or the internal dates are false.','A cópia em disco diz ser mais antiga que o próprio conteúdo. Relógios ou datas foram alterados, ou as datas internas são falsas.','La copie sur disque se dit plus ancienne que son contenu : horloges ou dates modifiées, ou dates internes fausses.','La copia su disco risulta più vecchia del contenuto: orologi o date alterati, o date interne false.','Kopia na dysku jest rzekomo starsza niż treść: zmieniono zegary lub daty albo daty wewnętrzne są fałszywe.','Die Kopie ist angeblich älter als ihr Inhalt: Uhren oder Daten verändert oder interne Daten falsch.','La copia en disco dice ser más antigua que el contenido: relojes o fechas alterados, o fechas internas falsas.'],
'f.no_meta':['No internal metadata (stripped)','Sem metadados internos (removidos)','Aucune métadonnée interne (supprimées)','Nessun metadato interno (rimossi)','Brak metadanych (usunięte)','Keine internen Metadaten (entfernt)','Sin metadatos internos (eliminados)'],
'fd.no_meta':['Messaging apps and social networks strip metadata; privacy tools do too. Origin and dates cannot be confirmed from the file itself.','Aplicativos de mensagens e redes sociais removem metadados, assim como ferramentas de privacidade. Origem e datas não podem ser confirmadas pelo próprio arquivo.','Messageries, réseaux sociaux et outils de confidentialité suppriment les métadonnées : origine et dates non confirmables par le fichier.','App di messaggistica, social e strumenti di privacy rimuovono i metadati: origine e date non verificabili dal file.','Komunikatory, serwisy społecznościowe i narzędzia prywatności usuwają metadane — pochodzenia i dat nie da się potwierdzić z pliku.','Messenger, soziale Netzwerke und Datenschutztools entfernen Metadaten; Herkunft und Daten sind aus der Datei nicht bestätigbar.','Mensajería, redes sociales y herramientas de privacidad eliminan metadatos: origen y fechas no confirmables por el archivo.'],

'fd.adobe_marks':['Segments written by Adobe software are present, which cameras do not create.','Há segmentos gravados por software Adobe, que câmeras não criam.','Des segments écrits par un logiciel Adobe sont présents, que les appareils ne créent pas.','Sono presenti segmenti scritti da software Adobe, che le fotocamere non creano.','Obecne są segmenty zapisane przez oprogramowanie Adobe, których aparaty nie tworzą.','Es gibt von Adobe-Software geschriebene Segmente, die Kameras nicht erzeugen.','Hay segmentos escritos por software Adobe, que las cámaras no crean.'],

'fd.media_zero':['Recording devices write the real time; converters and editors such as FFmpeg often leave it empty.','Dispositivos de gravação gravam a hora real; conversores e editores como o FFmpeg costumam deixá-la vazia.','Les appareils écrivent l’heure réelle ; convertisseurs et éditeurs (FFmpeg) la laissent souvent vide.','I dispositivi scrivono l’ora reale; convertitori ed editor (FFmpeg) la lasciano spesso vuota.','Urządzenia zapisują rzeczywisty czas; konwertery i edytory (FFmpeg) często go pomijają.','Aufnahmegeräte schreiben die echte Zeit; Konverter wie FFmpeg lassen sie oft leer.','Los dispositivos escriben la hora real; conversores y editores (FFmpeg) suelen dejarla vacía.'],
