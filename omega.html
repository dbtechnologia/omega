(()=>{const S2={
en:['targets','Target investigation (URLs, phones, e-mails)',['Paste online addresses, phone numbers or e-mail addresses (one per line) and press Investigate, or open “Found in the case” to see every address, phone and e-mail extracted automatically from the evidence and investigate one or all of them.','Online addresses: structure, Unicode/punycode and homograph letters, brand impersonation and typosquatting, government-domain imitation, shorteners, IP hosts, ports, risky file types, bait words, tracking parameters, Base64 data and hidden redirect destinations (analysed recursively). Phones: E.164, international and national formats, country, Brazilian area code (DDD) and region, mobile/landline, toll-free, premium, telemarketing and public-service numbers. E-mails: syntax, canonical form, disposable and free providers, look-alike and typo domains, misleading display names, role mailboxes and Gravatar hash.','Each target receives a risk score, findings with explanations, its occurrences in the evidence and notes. Nothing is contacted: the analysis is offline. Optional links open third-party verification services only if you click them.','Saved web pages (HTML, MHTML), browser HTTP archives (HAR), contacts (vCard), calendars (iCalendar) and internet shortcuts are also analysed as evidence: forms that send passwords elsewhere, trackers, obfuscated scripts, hidden frames, redirects, every request with time and server, appointments and contacts. Risky links and mailboxes found inside any file become findings of that file. The report includes the section “Investigated targets and indicators”.']],
pt:['targets','Investigação de alvos (URLs, telefones, e-mails)',['Cole endereços online, telefones ou e-mails (um por linha) e clique em Investigar, ou abra “Encontrados no caso” para ver todos os endereços, telefones e e-mails extraídos automaticamente das evidências e investigar um ou todos.','Endereços online: estrutura, Unicode/punycode e letras homógrafas, falsificação de marca e typosquatting, imitação de domínio do governo, encurtadores, hosts por IP, portas, arquivos de risco, palavras-isca, parâmetros de rastreamento, dados Base64 e destinos de redirecionamento ocultos (analisados em cascata). Telefones: E.164, formatos internacional e nacional, país, DDD e região, celular/fixo, 0800, tarifa especial, telemarketing e serviços públicos. E-mails: sintaxe, forma canônica, provedores descartáveis e gratuitos, domínios parecidos ou com erro de digitação, nome exibido enganoso, caixas funcionais e hash Gravatar.','Cada alvo recebe pontuação de risco, achados explicados, suas ocorrências nas evidências e notas. Nada é contatado: a análise é offline. Links opcionais abrem serviços de verificação de terceiros apenas se você clicar.','Páginas salvas (HTML, MHTML), arquivos HAR do navegador, contatos (vCard), agendas (iCalendar) e atalhos de internet também são analisados como evidências: formulários que enviam senhas a outro site, rastreadores, scripts ofuscados, quadros ocultos, redirecionamentos, cada requisição com horário e servidor, compromissos e contatos. Links e caixas de e-mail de risco encontrados em qualquer arquivo viram achados daquele arquivo. O relatório inclui a seção “Alvos investigados e indicadores”.']],
fr:['targets','Enquête sur cibles (URL, téléphones, e-mails)',['Collez des adresses, téléphones ou e-mails (un par ligne) et cliquez sur Enquêter, ou ouvrez « Trouvés dans le dossier » pour voir tout ce qui a été extrait automatiquement des preuves.','Adresses : structure, Unicode/punycode et homographes, usurpation de marque et typosquatting, imitation de domaine public, raccourcisseurs, IP, ports, fichiers à risque, mots-appâts, pistage, Base64 et redirections cachées. Téléphones : E.164, formats, pays, région, mobile/fixe, numéros spéciaux. E-mails : syntaxe, forme canonique, fournisseurs jetables et gratuits, domaines sosies, nom affiché trompeur, Gravatar.','Chaque cible reçoit un score de risque, des constats expliqués, ses occurrences et des notes. Rien n’est contacté ; les liens de vérification tiers ne s’ouvrent que si vous cliquez.','Pages enregistrées (HTML, MHTML), archives HAR, vCard, iCalendar et raccourcis sont aussi analysés. Les liens et adresses à risque trouvés dans un fichier deviennent des constats. Le rapport inclut la section « Cibles examinées et indicateurs ».']],
it:['targets','Indagine su obiettivi (URL, telefoni, e-mail)',['Incolla indirizzi, telefoni o e-mail (uno per riga) e premi Indaga, oppure apri «Trovati nel caso» per vedere tutto ciò che è stato estratto automaticamente dai reperti.','Indirizzi: struttura, Unicode/punycode e omografi, impersonificazione di marchi e typosquatting, imitazione di domini pubblici, accorciatori, IP, porte, file a rischio, parole esca, tracciamento, Base64 e reindirizzamenti nascosti. Telefoni: E.164, formati, paese, regione, mobile/fisso, numeri speciali. E-mail: sintassi, forma canonica, provider usa e getta e gratuiti, domini sosia, nome visualizzato ingannevole, Gravatar.','Ogni obiettivo riceve punteggio di rischio, rilievi spiegati, occorrenze e note. Nulla viene contattato; i link di verifica di terzi si aprono solo con un tuo clic.','Pagine salvate (HTML, MHTML), HAR, vCard, iCalendar e collegamenti sono analizzati come reperti. Link e indirizzi a rischio trovati in un file diventano rilievi. Il rapporto include la sezione «Obiettivi indagati e indicatori».']],
pl:['targets','Badanie celów (URL, telefony, e-maile)',['Wklej adresy, telefony lub e-maile (po jednym w wierszu) i kliknij Zbadaj albo otwórz „Znalezione w sprawie”, aby zobaczyć wszystko, co automatycznie wyodrębniono z dowodów.','Adresy: struktura, Unicode/punycode i homoglify, podszywanie się pod marki i typosquatting, imitacja domen rządowych, skracacze, IP, porty, ryzykowne pliki, słowa-przynęty, śledzenie, Base64 i ukryte przekierowania. Telefony: E.164, formaty, kraj, region, komórkowy/stacjonarny, numery specjalne. E-maile: składnia, postać kanoniczna, dostawcy tymczasowi i darmowi, domeny-sobowtóry, myląca nazwa, Gravatar.','Każdy cel otrzymuje wynik ryzyka, objaśnione ustalenia, wystąpienia i notatki. Nic nie jest kontaktowane; linki do zewnętrznych usług otwierają się tylko po kliknięciu.','Zapisane strony (HTML, MHTML), HAR, vCard, iCalendar i skróty są analizowane jako dowody. Ryzykowne linki i adresy w plikach stają się ustaleniami. Raport zawiera sekcję „Zbadane cele i wskaźniki”.']],
de:['targets','Zielermittlung (URLs, Telefone, E-Mails)',['Adressen, Telefonnummern oder E-Mails einfügen (eine pro Zeile) und Untersuchen drücken, oder „Im Fall gefunden“ öffnen, um alles automatisch Extrahierte zu sehen.','Adressen: Struktur, Unicode/Punycode und Homographen, Markenimitation und Typosquatting, Behördenimitation, Kurzlinks, IPs, Ports, riskante Dateien, Köderwörter, Tracking, Base64 und versteckte Weiterleitungen. Telefone: E.164, Formate, Land, Region, Mobil/Festnetz, Sondernummern. E-Mails: Syntax, kanonische Form, Wegwerf- und Freemail-Anbieter, Doppelgänger-Domains, irreführende Anzeigenamen, Gravatar.','Jedes Ziel erhält Risikowert, erläuterte Befunde, Vorkommen und Notizen. Nichts wird kontaktiert; Prüflinks zu Drittanbietern öffnen sich nur per Klick.','Gespeicherte Seiten (HTML, MHTML), HAR, vCard, iCalendar und Verknüpfungen werden als Beweismittel ausgewertet. Riskante Links und Adressen in Dateien werden zu Befunden. Der Bericht enthält den Abschnitt „Untersuchte Ziele und Indikatoren“.']],
es:['targets','Investigación de objetivos (URL, teléfonos, correos)',['Pegue direcciones, teléfonos o correos (uno por línea) y pulse Investigar, o abra «Encontrados en el caso» para ver todo lo extraído automáticamente de las evidencias.','Direcciones: estructura, Unicode/punycode y homógrafos, suplantación de marcas y typosquatting, imitación de dominios públicos, acortadores, IP, puertos, archivos de riesgo, palabras cebo, rastreo, Base64 y redirecciones ocultas. Teléfonos: E.164, formatos, país, región, móvil/fijo, números especiales. Correos: sintaxis, forma canónica, proveedores desechables y gratuitos, dominios parecidos, nombre mostrado engañoso, Gravatar.','Cada objetivo recibe puntuación de riesgo, hallazgos explicados, apariciones y notas. No se contacta nada; los enlaces de verificación de terceros solo se abren si hace clic.','Páginas guardadas (HTML, MHTML), HAR, vCard, iCalendar y accesos directos se analizan como evidencias. Enlaces y direcciones de riesgo hallados en archivos se convierten en hallazgos. El informe incluye la sección «Objetivos investigados e indicadores».']]};

'gr.intro':['Entities recorded in the evidence (people, accounts, phones, devices, organisations, domains, IPs and places) were linked to the files in which they appear: {n} entities, {e} links, {c} independent clusters. Centrality (betweenness) shows which entities connect otherwise separate parts of the case.','As entidades registradas nas evidências (pessoas, contas, telefones, dispositivos, organizações, domínios, IPs e locais) foram ligadas aos arquivos em que aparecem: {n} entidades, {e} vínculos, {c} agrupamentos independentes. A centralidade (intermediação) mostra quais entidades conectam partes do caso que, de outra forma, estariam separadas.','Les entités des preuves ont été reliées aux fichiers où elles figurent : {n} entités, {e} liens, {c} groupes indépendants. La centralité (intermédiarité) montre quelles entités relient des parties séparées du dossier.','Le entità dei reperti sono state collegate ai file in cui compaiono: {n} entità, {e} collegamenti, {c} gruppi indipendenti. La centralità (intermediazione) mostra quali entità uniscono parti separate del caso.','Obiekty z dowodów połączono z plikami, w których występują: {n} obiektów, {e} powiązań, {c} niezależnych skupisk. Centralność (pośrednictwo) wskazuje obiekty łączące odrębne części sprawy.','Die Entitäten der Beweismittel wurden mit den Dateien verknüpft, in denen sie vorkommen: {n} Entitäten, {e} Verknüpfungen, {c} unabhängige Cluster. Die Zentralität (Betweenness) zeigt, welche Entitäten getrennte Teile des Falls verbinden.','Las entidades de las evidencias se vincularon con los archivos donde aparecen: {n} entidades, {e} vínculos, {c} grupos independientes. La centralidad (intermediación) muestra qué entidades conectan partes separadas del caso.'],

'ach.intro':['Analysis of Competing Hypotheses (Heuer, CIA): list every reasonable explanation, rate each evidence item against each one and prefer the hypothesis with the LEAST inconsistent evidence — not the one with the most support. Ratings are weighted by the credibility grade of each item.','Análise de Hipóteses Concorrentes (Heuer, CIA): liste todas as explicações razoáveis, avalie cada evidência contra cada uma e prefira a hipótese com MENOS evidências inconsistentes — não a com mais apoio. As avaliações são ponderadas pela credibilidade de cada item.','Analyse des hypothèses concurrentes (Heuer, CIA) : listez toutes les explications, évaluez chaque preuve contre chacune et préférez celle qui a le MOINS de preuves incohérentes. Pondération par la crédibilité.','Analisi delle ipotesi concorrenti (Heuer, CIA): elenca tutte le spiegazioni, valuta ogni reperto rispetto a ciascuna e preferisci quella con MENO elementi incoerenti. Ponderazione per credibilità.','Analiza konkurencyjnych hipotez (Heuer, CIA): wypisz wszystkie wyjaśnienia, oceń każdy dowód względem każdej i wybierz tę z NAJMNIEJSZĄ liczbą sprzecznych dowodów. Wagi wg wiarygodności.','Analyse konkurrierender Hypothesen (Heuer, CIA): alle Erklärungen auflisten, jedes Beweismittel gegen jede bewerten und die mit den WENIGSTEN Widersprüchen bevorzugen. Gewichtung nach Glaubwürdigkeit.','Análisis de hipótesis en competencia (Heuer, CIA): enumere todas las explicaciones, evalúe cada evidencia frente a cada una y prefiera la que tenga MENOS evidencias inconsistentes. Ponderación por credibilidad.'],

'ach.help':['Evidence that fits every hypothesis equally is not diagnostic: it does not help to choose. Focus on items that discriminate between hypotheses and look for evidence that would refute the leading one.','Evidência que se encaixa igualmente em todas as hipóteses não é diagnóstica: não ajuda a escolher. Foque nos itens que discriminam e procure evidências que refutariam a hipótese líder.','Une preuve compatible avec toutes les hypothèses n’est pas diagnostique. Cherchez ce qui réfuterait l’hypothèse principale.','Un reperto compatibile con tutte le ipotesi non è diagnostico. Cerca ciò che confuterebbe l’ipotesi principale.','Dowód pasujący do wszystkich hipotez nie jest diagnostyczny. Szukaj dowodów obalających wiodącą hipotezę.','Beweise, die zu allen Hypothesen passen, sind nicht diagnostisch. Suchen Sie nach Widerlegungen der führenden Hypothese.','Una evidencia compatible con todas las hipótesis no es diagnóstica. Busque lo que refutaría la hipótesis principal.'],

'gd.intro':['Each item was graded with the Admiralty (NATO) system: a letter for the reliability of the source and a number for the credibility of the information. F6 means not yet evaluated.','Cada item foi classificado pelo sistema do Almirantado (OTAN): uma letra para a confiabilidade da fonte e um número para a credibilidade da informação. F6 significa ainda não avaliado.','Chaque élément est coté selon le système de l’Amirauté (OTAN) : une lettre pour la source, un chiffre pour l’information. F6 = non évalué.','Ogni elemento è valutato col sistema dell’Ammiragliato (NATO): una lettera per la fonte, un numero per l’informazione. F6 = non valutato.','Każdy element oceniono systemem Admiralicji (NATO): litera dla źródła, cyfra dla informacji. F6 = nieocenione.','Jedes Element wurde nach dem Admiralty-System (NATO) bewertet: Buchstabe für die Quelle, Zahl für die Information. F6 = nicht bewertet.','Cada elemento se calificó con el sistema del Almirantazgo (OTAN): letra para la fuente y número para la información. F6 = sin evaluar.'],

'ca.help':['File carving recovers complete files hidden or embedded inside this item (appended, inside archives, thumbnails, documents, disk images). Extracted files become new evidence linked to their parent, hashed and analysed.','A recuperação (carving) extrai arquivos completos escondidos ou embutidos neste item (anexados, em pacotes, miniaturas, documentos, imagens de disco). Os extraídos viram novas evidências ligadas à origem, com hash e análise.','Le carving récupère des fichiers complets cachés ou incorporés ; ils deviennent de nouvelles preuves liées à leur parent.','Il carving recupera file completi nascosti o incorporati; diventano nuovi reperti collegati al genitore.','Carving odzyskuje kompletne ukryte lub osadzone pliki; stają się nowymi dowodami powiązanymi z rodzicem.','Carving stellt versteckte oder eingebettete Dateien wieder her; sie werden zu neuen, verknüpften Beweismitteln.','El carving recupera archivos completos ocultos o incrustados; se convierten en nuevas evidencias vinculadas.'],

'il.h.lsb':['Shows the least significant bit of each colour and runs the chi-square attack (Westfeld & Pfitzmann). Data hidden in the lowest bits equalises pairs of values; a probability near 100% in the first part of the image suggests sequential embedding.','Mostra o bit menos significativo de cada cor e aplica o ataque qui-quadrado (Westfeld & Pfitzmann). Dados escondidos nos bits mais baixos igualam pares de valores; probabilidade perto de 100% no início da imagem sugere inserção sequencial.','Affiche le bit de poids faible et applique l’attaque du khi-deux (Westfeld & Pfitzmann). Une probabilité proche de 100 % au début suggère une insertion séquentielle.','Mostra il bit meno significativo e applica l’attacco chi-quadro (Westfeld & Pfitzmann). Una probabilità vicina al 100% all’inizio suggerisce un inserimento sequenziale.','Pokazuje najmniej znaczący bit i stosuje atak chi-kwadrat (Westfeld & Pfitzmann). Prawdopodobieństwo bliskie 100% na początku sugeruje sekwencyjne osadzanie.','Zeigt das niederwertigste Bit und führt den Chi-Quadrat-Angriff aus (Westfeld & Pfitzmann). Werte nahe 100 % am Bildanfang deuten auf sequentielle Einbettung.','Muestra el bit menos significativo y aplica el ataque chi-cuadrado (Westfeld & Pfitzmann). Una probabilidad cercana al 100% al inicio sugiere inserción secuencial.'],
'lsb.stat':['Embedding probability in the first 10% — R {r}% · G {g}% · B {b}%; whole image — R {rf}% · G {gf}% · B {bf}%.','Probabilidade de inserção nos primeiros 10% — R {r}% · G {g}% · B {b}%; imagem inteira — R {rf}% · G {gf}% · B {bf}%.','Probabilité d’insertion sur les 10 % initiaux — R {r} % · V {g} % · B {b} % ; image entière — R {rf} % · V {gf} % · B {bf} %.','Probabilità di inserimento nel primo 10% — R {r}% · G {g}% · B {b}%; immagine intera — R {rf}% · G {gf}% · B {bf}%.','Prawdopodobieństwo osadzenia w pierwszych 10% — R {r}% · G {g}% · B {b}%; cały obraz — R {rf}% · G {gf}% · B {bf}%.','Einbettungswahrscheinlichkeit erste 10 % — R {r} % · G {g} % · B {b} %; ganzes Bild — R {rf} % · G {gf} % · B {bf} %.','Probabilidad de inserción en el primer 10% — R {r}% · G {g}% · B {b}%; imagen completa — R {rf}% · G {gf}% · B {bf}%.'],
'lsb.lossy':['Lossy format (JPEG/WebP/HEIC): LSB statistics of decoded pixels are not meaningful; use this test on PNG, BMP or TIFF.','Formato com perdas (JPEG/WebP/HEIC): estatísticas LSB de pixels decodificados não são significativas; use o teste em PNG, BMP ou TIFF.','Format avec pertes : statistiques LSB non significatives ; utilisez PNG, BMP ou TIFF.','Formato con perdita: statistiche LSB non significative; usa PNG, BMP o TIFF.','Format stratny: statystyki LSB nieistotne; użyj PNG, BMP lub TIFF.','Verlustbehaftetes Format: LSB-Statistik nicht aussagekräftig; PNG, BMP oder TIFF verwenden.','Formato con pérdida: estadística LSB no significativa; use PNG, BMP o TIFF.'],

'rp.methodtxt3':['Intelligence techniques: link analysis with betweenness centrality and shortest paths; pattern-of-life analysis by weekday, hour and actor; full-text search with watchlists and known-hash sets; file carving of embedded files; chi-square LSB steganalysis; source grading with the Admiralty (NATO) code; Analysis of Competing Hypotheses (Heuer); and estimative language according to US ICD 203.','Técnicas de inteligência: análise de vínculos com centralidade de intermediação e caminhos mais curtos; padrão de vida por dia, hora e ator; busca total com listas de vigilância e conjuntos de hashes conhecidos; recuperação (carving) de arquivos embutidos; esteganálise LSB por qui-quadrado; classificação de fontes pelo código do Almirantado (OTAN); Análise de Hipóteses Concorrentes (Heuer); e linguagem de estimativa segundo a ICD 203 dos EUA.','Techniques de renseignement : analyse de liens (intermédiarité, plus courts chemins) ; schéma de vie ; recherche avec listes de veille et jeux de hashs ; carving ; stéganalyse LSB (khi-deux) ; cotation Amirauté (OTAN) ; ACH (Heuer) ; langage d’estimation ICD 203.','Tecniche di intelligence: analisi dei collegamenti (intermediazione, percorsi minimi); modello di vita; ricerca con watchlist e set di hash; carving; steganalisi LSB (chi-quadro); valutazione Ammiragliato (NATO); ACH (Heuer); linguaggio di stima ICD 203.','Techniki wywiadowcze: analiza powiązań (pośrednictwo, najkrótsze ścieżki); wzorzec aktywności; wyszukiwanie z listami i zbiorami skrótów; carving; steganaliza LSB (chi-kwadrat); ocena Admiralicji (NATO); ACH (Heuer); język szacunków ICD 203.','Nachrichtendienstliche Techniken: Verknüpfungsanalyse (Betweenness, kürzeste Pfade); Lebensmuster; Volltextsuche mit Beobachtungslisten und Hashsets; Carving; LSB-Steganalyse (Chi-Quadrat); Admiralty-Bewertung (NATO); ACH (Heuer); Schätzsprache nach ICD 203.','Técnicas de inteligencia: análisis de vínculos (intermediación, caminos más cortos); patrón de vida; búsqueda con listas de vigilancia y conjuntos de hashes; carving; estegoanálisis LSB (chi-cuadrado); calificación del Almirantazgo (OTAN); ACH (Heuer); lenguaje de estimación ICD 203.'],

'glo.exif':['EXIF / XMP — Standard metadata blocks of photos and documents (camera, settings, GPS, edit history).','EXIF / XMP — Blocos padrão de metadados de fotos e documentos (câmera, ajustes, GPS, histórico de edição).','EXIF / XMP — Blocs de métadonnées des photos et documents.','EXIF / XMP — Blocchi di metadati di foto e documenti.','EXIF / XMP — Standardowe bloki metadanych zdjęć i dokumentów.','EXIF / XMP — Standard-Metadatenblöcke von Fotos und Dokumenten.','EXIF / XMP — Bloques estándar de metadatos de fotos y documentos.'],
'glo.ela':['ELA — Error Level Analysis: re-compression that highlights regions saved at a different time.','ELA — Análise de Nível de Erro: recompressão que destaca regiões salvas em outro momento.','ELA — Analyse du niveau d’erreur, révèle des zones enregistrées à part.','ELA — Analisi del livello di errore, evidenzia aree salvate separatamente.','ELA — Analiza poziomu błędu, uwydatnia obszary zapisane osobno.','ELA — Fehlerniveau-Analyse, hebt separat gespeicherte Bereiche hervor.','ELA — Análisis de nivel de error, resalta zonas guardadas aparte.'],
'glo.lsb':['LSB steganalysis — Statistical test for data hidden in the least significant bits of pixels.','Esteganálise LSB — Teste estatístico para dados ocultos nos bits menos significativos dos pixels.','Stéganalyse LSB — Test de données cachées dans les bits de poids faible.','Steganalisi LSB — Test per dati nascosti nei bit meno significativi.','Steganaliza LSB — Test danych ukrytych w najmłodszych bitach.','LSB-Steganalyse — Test auf in niederwertigen Bits versteckte Daten.','Estegoanálisis LSB — Prueba de datos ocultos en los bits menos significativos.'],
'glo.carve':['Carving — Recovery of complete files from inside other files by their structure.','Carving — Recuperação de arquivos completos de dentro de outros arquivos pela estrutura.','Carving — Récupération de fichiers à l’intérieur d’autres fichiers.','Carving — Recupero di file dentro altri file.','Carving — Odzyskiwanie plików z wnętrza innych plików.','Carving — Wiederherstellung von Dateien aus anderen Dateien.','Carving — Recuperación de archivos dentro de otros archivos.'],
'glo.graph':['Link analysis — Network of entities (people, accounts, devices) connected through the evidence.','Análise de vínculos — Rede de entidades (pessoas, contas, dispositivos) ligadas pelas evidências.','Analyse de liens — Réseau d’entités reliées par les preuves.','Analisi dei collegamenti — Rete di entità collegate dai reperti.','Analiza powiązań — Sieć obiektów połączonych przez dowody.','Verknüpfungsanalyse — Netz von Entitäten, verbunden über Beweismittel.','Análisis de vínculos — Red de entidades conectadas por las evidencias.'],
'glo.central':['Betweenness centrality — How often an entity lies on the shortest path between others; identifies brokers.','Centralidade de intermediação — Frequência com que uma entidade está no caminho mais curto entre outras; identifica intermediários.','Centralité d’intermédiarité — Fréquence sur les plus courts chemins ; identifie les relais.','Centralità di intermediazione — Frequenza sui percorsi minimi; identifica gli intermediari.','Centralność pośrednictwa — Jak często obiekt leży na najkrótszych ścieżkach; wskazuje pośredników.','Betweenness-Zentralität — Wie oft eine Entität auf kürzesten Pfaden liegt; zeigt Vermittler.','Centralidad de intermediación — Frecuencia en caminos más cortos; identifica intermediarios.'],
'glo.pol':['Pattern of life — Habitual timing of an actor’s activity (hours, days, silences).','Padrão de vida — Horários habituais da atividade de um ator (horas, dias, silêncios).','Schéma de vie — Rythme habituel d’activité d’un acteur.','Modello di vita — Ritmo abituale di attività di un attore.','Wzorzec aktywności — Typowy rytm działań osoby.','Lebensmuster — Gewohnheitsmäßiger Aktivitätsrhythmus eines Akteurs.','Patrón de vida — Ritmo habitual de actividad de un actor.'],
'glo.ach':['ACH — Analysis of Competing Hypotheses: choose the explanation with the least inconsistent evidence.','ACH — Análise de Hipóteses Concorrentes: escolhe a explicação com menos evidências inconsistentes.','ACH — Analyse des hypothèses concurrentes : la moins contredite l’emporte.','ACH — Analisi delle ipotesi concorrenti: prevale la meno contraddetta.','ACH — Analiza konkurencyjnych hipotez: wygrywa najmniej sprzeczna.','ACH — Analyse konkurrierender Hypothesen: die am wenigsten widerlegte gewinnt.','ACH — Análisis de hipótesis en competencia: gana la menos contradicha.'],

function newR(){return {groups:{},events:[],ids:[],locs:[],findings:[],dims:null,thumb:null,xmp:0,flags:{},attach:[],sw:[],urls:[],emails:[],phones:[]}}
function put(R,g,k,v){
  if(v===undefined||v===null||v===''||(typeof v==='number'&&!isFinite(v)))return;
  if(typeof v==='string'){v=v.replace(/\u0000+$/,'');if(v.length>4000)v=v.slice(0,4000)+'…';if(!v.trim())return}
  const G=R.groups[g]||(R.groups[g]={});
  if(G[k]!==undefined){if(G[k]===v)return;let i=2;while(G[k+' #'+i]!==undefined){if(G[k+' #'+i]===v)return;i++}G[k+' #'+i]=v}else G[k]=v;
}
function addEv(R,kind,d,label,src,o={}){
  if(!d)return;const ms=typeof d==='number'?d:d.ms;if(ms==null||!isFinite(ms))return;
  const y=new Date(ms).getUTCFullYear();if(y<1971||y>2100)return;
  R.events.push({kind,ts:ms,label,lp:o.lp||null,src,detail:o.detail||'',floating:typeof d==='object'?!!d.floating:!!o.floating,conf:o.conf||'high'});
}
function addId(R,role,value,src){value=String(value==null?'':value).replace(/\s+/g,' ').trim();if(!value||value.length>300||/^[\s\-_.0]*$/.test(value))return;if(R.ids.some(x=>x.role===role&&x.value===value))return;R.ids.push({role,value,src})}
function addLoc(R,lat,lon,src,o={}){lat=+lat;lon=+lon;if(!isFinite(lat)||!isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180||(lat===0&&lon===0))return;if(R.locs.some(l=>Math.abs(l.lat-lat)<1e-7&&Math.abs(l.lon-lon)<1e-7))return;R.locs.push({lat,lon,alt:o.alt,src,ts:o.ts||null})}
function addF(R,sev,key,p={}){const k=key+JSON.stringify(p);if(R.findings.some(f=>f._k===k))return;R.findings.push({sev,key,p,_k:k})}

function checkSw(R,s,src){

  if(ascii(u8,4,4)==='ftyp'){const b=ascii(u8,8,4);
    if(/hei|mif1|msf1|avif|heix|hevc/.test(b))return r('heic','image','image/heic','HEIF/HEIC');
    if(/M4A|M4B|M4P/.test(b))return r('mp4','audio','audio/mp4','MPEG-4 Audio ('+b.trim()+')');
    return r('mp4','video',b==='qt  '?'video/quicktime':'video/mp4',(b==='qt  '?'QuickTime MOV':'MPEG-4')+' ('+b.trim()+')')}
  if(['moov','mdat','wide','free'].includes(ascii(u8,4,4)))return r('mp4','video','video/quicktime','QuickTime MOV');
  if(u8[0]===0x1A&&u8[1]===0x45&&u8[2]===0xDF&&u8[3]===0xA3){const s=latin1(u8.subarray(0,64));return r('mkv',s.includes('webm')?'video':'video',s.includes('webm')?'video/webm':'video/x-matroska',s.includes('webm')?'WebM':'Matroska')}
  if(a4==='II*\0'||a4==='MM\0*')return r('tiff','image','image/tiff','TIFF/RAW');
  if(u8[0]===0x42&&u8[1]===0x4D&&u32le(u8,2)===u8.length)return r('bmp','image','image/bmp','BMP');
  if(a4==='\xD0\xCF\x11\xE0')return r('ole','document','application/x-ole-storage','MS Office 97-2003 (OLE)');

  if(a4==='Rar!')return r('rar','archive','application/vnd.rar','RAR');

  if(u8[0]===0x1F&&u8[1]===0x8B)return r('gz','archive','application/gzip','GZIP');

  const urls=[...new Set([...R.ids.filter(i=>i.role==='url').map(i=>i.value),...(R.urls||[])])].slice(0,60);let n=0;
  for(const u of urls){const a=analyzeURL(u);const sc=targetScore(a);if(sc<80&&n<8){const all=[...a.findings,...(a.nested||[]).flatMap(n=>n.findings)];const top=all.filter(f=>f.sev!=='info').sort((x,y)=>SEV_ORDER[x.sev]-SEV_ORDER[y.sev])[0];addF(R,sc<50||all.some(f=>f.sev==='high')?'high':'med','url_risk',{url:(a.href||u).slice(0,120),why:top?t('f.'+top.key,top.p):''});n++}}
  const mails=[...new Set([...(R.emails||[]),...R.ids.filter(i=>['email','sender','replyto','recipient'].includes(i.role)).map(i=>i.value)])].slice(0,40);let k=0;
  for(const m of mails){const a=analyzeEmail(m);if(!a.valid)continue;const bad=a.findings.filter(f=>['m_disposable','m_lookalike','m_idn','m_typo','m_display'].includes(f.key));if(bad.length&&k<6){addF(R,'med','mail_risk',{mail:a.address,why:t('f.'+bad[0].key,bad[0].p)});k++}}
}

function idToEntities(i){
  const v=String(i.value).trim();const out=[];const em=v.match(/[\w.+\-]+@[\w\-]+(?:\.[\w\-]+)+/);
  if(['sender','recipient','replyto','email','account'].includes(i.role)){if(em){out.push(['email',em[0]]);const nm=v.replace(/<[^>]*>/,'').replace(em[0],'').replace(/["'<>]/g,'').trim();if(nm&&nm.length>1&&!/@/.test(nm))out.push(['person',nm])}else if(i.role==='account')out.push(['account',v]);else if(v)out.push(['person',v]);return out}
  if(PERSON_R.has(i.role)){if(em){out.push(['email',em[0]])}const nm=v.replace(/\s*\([^)]*\)\s*$/,'').replace(em?em[0]:'#','').trim();if(nm)out.push(['person',nm]);return out}
  if(i.role==='phone')return [['phone',v]];if(i.role==='ip')return [['ip',v]];if(i.role==='domain')return [['domain',v.toLowerCase()]];
  if(i.role==='url'){try{return [['domain',new URL(/^[a-z]+:/i.test(v)?v:'https://'+v).hostname.toLowerCase()]]}catch(e){return []}}
  if(i.role==='device'||i.role==='serial'||i.role==='host')return [['device',v]];if(i.role==='company')return [['org',v]];if(i.role==='software')return [['software',v]];

}

    for(const i of ev.R.ids){const ents=idToEntities(i).filter(([ty])=>o.software||ty!=='software');const ns=ents.map(([ty,v])=>{const n=node(entKey(ty,v),ty,v);n.files.add(ev);n.roles.add(i.role);return n});

  for(const tg of S.targets){const ty=tg.type==='url'?'domain':tg.type;let v=tg.value;if(ty==='domain'){try{v=new URL(/^[a-z]+:/i.test(v)?v:'https://'+v).hostname}catch(e){}}const n=node(entKey(ty,v),ty,v);n.target=tg;n.risk=targetScore(analyzeTarget(tg.type,tg.value))}

function finishGraph(nodes,edges){

function shortestPath(g,a,b){const prev=new Int32Array(g.nodes.length).fill(-1);const seen=new Uint8Array(g.nodes.length);const Q=[a];seen[a]=1;let qi=0;

  for(const ev of S.evidence){if(!ev.R)continue;test(ev,'name',t('col.name'),ev.name);
    if(scope.meta)for(const [g,kv] of Object.entries(ev.R.groups))for(const [k,v] of Object.entries(kv))test(ev,'meta',g+' › '+k,v);
    if(scope.ids)ev.R.ids.forEach(i=>test(ev,'ids',t('role.'+i.role),i.value));

    if(scope.text&&ev.R.text)test(ev,'text',t('g.text'),ev.R.text);
    (ev.notes)&&test(ev,'notes',t('ins.notes'),ev.notes);if(out.length>=limit)break}

function normCdf(z){const t2=1/(1+0.2316419*Math.abs(z));const d=0.3989423*Math.exp(-z*z/2);const p=d*t2*(0.3193815+t2*(-0.3565638+t2*(1.781478+t2*(-1.821256+t2*1.330274))));return z>0?1-p:p}
function chiP(chi,df){if(df<1)return 0;const z=(Math.pow(chi/df,1/3)-(1-2/(9*df)))/Math.sqrt(2/(9*df));return 1-normCdf(z)}
function lsbChi(data,steps=10){const n=data.length/4;const res=[[],[],[]];
  for(let c=0;c<3;c++){const h=new Float64Array(256);let k=0;for(let s=1;s<=steps;s++){const end=Math.floor(n*s/steps);for(;k<end;k++)h[data[k*4+c]]++;let chi=0,df=-1;for(let j=0;j<128;j++){const e=(h[2*j]+h[2*j+1])/2;if(e>4){chi+=(h[2*j]-e)**2/e;df++}}res[c].push(chiP(chi,df))}}
  return res}

  let t0=0,b0=th.height-1,l0=0,r0=th.width-1;while(t0<b0&&row(t0)<10)t0++;while(b0>t0&&row(b0)<10)b0--;while(l0<r0&&col(l0)<10)l0++;while(r0>l0&&col(r0)<10)r0--;

  const a1=main.width/main.height,a2=tw/thh;if(Math.abs(a1-a2)/a1>0.07&&Math.abs(1/a1-a2)/a2>0.07)return 99;

/* ================= APPS: timeline, map, hex, compare, report ================= */
const TSTEPS=[1e3,5e3,15e3,3e4,6e4,3e5,9e5,18e5,36e5,108e5,216e5,432e5,864e5,1728e5,6048e5,'1M','3M','6M','1Y','2Y','5Y','10Y','20Y','50Y','100Y'];
const stepMs=s=>typeof s==='number'?s:parseInt(s)*(s.endsWith('M')?2629800000:31557600000);
function tlTicks(t0,t1,maxN){
  const span=t1-t0;const step=TSTEPS.find(s=>span/stepMs(s)<=maxN)||'100Y';const out=[];const utc=S.settings.tz==='utc';
  if(typeof step==='number'){const off=utc?0:new Date(t0).getTimezoneOffset()*60000;let k=Math.ceil((t0-off)/step)*step+off;let g=0;while(k<=t1&&g++<500){out.push(k);k+=step}}
  else{const n=parseInt(step),y=step.endsWith('Y');const d=new Date(t0);const Y=utc?d.getUTCFullYear():d.getFullYear(),M=utc?d.getUTCMonth():d.getMonth();
    let yy=y?Math.floor(Y/n)*n:Y,mm=y?0:Math.floor(M/n)*n;let g=0;
    while(g++<500){const ms=utc?Date.UTC(yy,mm,1):new Date(yy,mm,1).getTime();if(ms>t1)break;if(ms>=t0)out.push(ms);if(y)yy+=n;else{mm+=n;while(mm>11){mm-=12;yy++}}}}

    const d=lineDiff(ta,tb);if(!vis.isConnected)return;if(!d){vis.innerHTML=`<p class="muted">${esc(t('cmp.toolarge'))}</p>`;return}const keep=d.map((x,i)=>x[0]!==' '||d.slice(Math.max(0,i-2),i+3).some(y=>y[0]!==' '));

}};

    <h3>${e8(T('ov.clusters',{m:st.ctxMin}))}</h3>${cl.length?`<table><tbody>${cl.slice(0,30).map(x=>`<tr><td class="mono">${e8(fmtDate(x.a))} → ${e8(fmtDate(x.b))}</td><td>${e8(T('ov.cluster',{n:x.events.length,f:x.files.size}))}</td><td>${[...x.files].map(e=>e8(e.name)).join(', ')}</td></tr>`).join('')}</tbody></table>`:`<p class="muted">${e8(T('ov.noclusters'))}</p>`}

async function addFiles(list,meta){
  const arr=Array.from(list||[]).filter(f=>f&&f.size>=0);if(!arr.length)return;
  const fresh=[];
  for(const f of arr){const ev={id:uid(),file:f,name:f.name,size:f.size,added:Date.now(),status:'queue',notes:'',obs:[],...(meta&&meta.parent?{parent:meta.parent,poff:meta.poff}:{})};S.evidence.push(ev);fresh.push(ev);DB.put('files',ev.id,{name:f.name,type:f.type,lastModified:f.lastModified,blob:f})}
  BUS.emit('change');if(!WM.wins.evidence&&!WM.wins.overview)openApp('evidence');toast(t('ui.analyzing',{n:arr.length}));
  for(const ev of fresh){await analyzeEvidence(ev);crossCheck();await logC(ev.parent?'c.carved':'c.added',ev.name,ev.hashes?'SHA-256 '+ev.hashes.sha256+' · '+ev.size+' bytes · '+(ev.det?ev.det.label:''):(ev.err||''));BUS.emit('change')}
  saveCase();toast(t('ui.analyzed',{n:arr.length}));
}
function removeEvidence(id){const i=S.evidence.findIndex(e=>e.id===id);if(i<0)return;const ev=S.evidence[i];S.evidence.splice(i,1);if(ev.url)URL.revokeObjectURL(ev.url);if(ev.thumbURL)URL.revokeObjectURL(ev.thumbURL);DB.del('files',id);
  logC('c.removed',ev.name,ev.hashes?'SHA-256 '+ev.hashes.sha256:'');crossCheck();saveCase();BUS.emit('change')}
async function restore(){
  const meta=await DB.get('kv','case');const files=await DB.all('files');if(meta&&Array.isArray(meta.custody))S.custody=meta.custody;if(meta&&Array.isArray(meta.targets))S.targets=meta.targets;if(meta){['tags','watch','hashset','kj'].forEach(k=>{if(Array.isArray(meta[k]))S[k]=meta[k]});if(meta.ach&&meta.ach.hyps)S.ach=meta.ach;if(typeof meta.bluf==='string')S.bluf=meta.bluf;if(meta.graphImg)S.graphImg=meta.graphImg}
  for(const [id,v] of files){if(!v||!v.blob)continue;const f=v.blob instanceof File?v.blob:new File([v.blob],v.name,{type:v.type,lastModified:v.lastModified});const m=((meta&&meta.ev)||[]).find(x=>x.id===id)||{};
    S.evidence.push({id,file:f,name:v.name,size:f.size,added:m.added||Date.now(),status:'queue',notes:m.notes||'',obs:m.obs||[],grade:m.grade||null,parent:m.parent||null,poff:m.poff})}
  S.evidence.sort((a,b)=>a.added-b.added);BUS.emit('change');
  for(const ev of S.evidence)await analyzeEvidence(ev);crossCheck();BUS.emit('change');

function buildWatermark(){let r='';for(let i=0;i<36;i++){const a=i*Math.PI/18,l=i%2?150:205;r+=`<path d="M${210+Math.cos(a)*118} ${200+Math.sin(a)*118}L${210+Math.cos(a)*l} ${200+Math.sin(a)*l}" stroke-width="${i%2?2:3}"/>`}

function boot(){
  loadSettings();

  renderDesk();tick();setInterval(tick,15000);
